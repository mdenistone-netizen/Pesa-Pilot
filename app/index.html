
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="description" content="PesaPilot — make your money last until the next payday." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PesaPilot — Make your money last</title>
  <style>
    /* =====================================================================
       PesaPilot design system (DEC-021): modern, calm, clean, welcoming.
       Tokens first; components only use tokens. See docs/DESIGN_SYSTEM.md.
       ===================================================================== */
    @font-face {
      font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url("fonts/inter-latin-wght-normal.woff2") format("woff2");
    }
    :root {
      /* Brand palette (owner-approved starting point) */
      --c-primary: #183B35;        /* deep forest green: primary actions, brand */
      --c-primary-hover: #234F47;
      --c-sage: #E8F0E9;           /* soft sage: supporting surfaces */
      --c-sage-strong: #D5E4D8;
      --c-bg: #FAF9F6;             /* page background */
      --c-card: #FFFFFF;
      --c-text: #253238;           /* main text */
      --c-text-2: #56656A;         /* secondary text (AA on white and background) */
      --c-border: #E8E6E0;
      --c-border-strong: #D6D3CB;
      --c-amber: #D99A45;          /* muted amber: attention, accents */
      --c-amber-text: #8A5A17;     /* amber for small text (AA) */
      --c-amber-soft: #FBF2E4;
      --c-success: #27845B;        /* money in, on track */
      --c-success-text: #1F6E4B;
      --c-success-soft: #E5F2EA;
      --c-danger: #C65B55;         /* money out, errors, overdue */
      --c-danger-text: #A8443F;
      --c-danger-soft: #F9E9E7;
      --c-on-primary: #FFFFFF;
      --c-hero-text-2: #CFE0D8;
      --c-focus: rgba(39,132,91,.35);
      --shadow-1: 0 1px 2px rgba(24,59,53,.05), 0 2px 10px rgba(24,59,53,.04);
      --shadow-2: 0 10px 30px rgba(24,59,53,.12);
      /* Type scale */
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 16px; --fs-lg: 17px; --fs-h1: 22px; --fs-figure: 26px; --fs-hero: 30px;
      --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
      /* Spacing, shape */
      --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;
      --r-sm: 10px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;
      --touch: 44px;
      /* Legacy aliases still referenced by inline styles in templates */
      --ink: var(--c-text); --ink-2: var(--c-text); --muted: var(--c-text-2); --muted-light: var(--c-text-2);
      --line: var(--c-border); --paper: var(--c-bg); --card: var(--c-card);
      --teal: var(--c-success); --teal-dark: var(--c-primary); --teal-soft: var(--c-sage);
      --blue: var(--c-primary); --blue-dark: var(--c-primary); --blue-soft: var(--c-sage);
      --amber: var(--c-amber); --amber-dark: var(--c-amber-text); --amber-soft: var(--c-amber-soft);
      --red: var(--c-danger); --red-dark: var(--c-danger-text); --red-soft: var(--c-danger-soft);
      --green: var(--c-success); --green-soft: var(--c-success-soft);
      --radius: var(--r-lg); --shadow: var(--shadow-1);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --c-primary: #2D6E5E; --c-primary-hover: #357D6B; --c-sage: #1E302B; --c-sage-strong: #284039;
      --c-bg: #101917; --c-card: #172421; --c-text: #E7EFEB; --c-text-2: #A9BAB3;
      --c-border: #263732; --c-border-strong: #33473F;
      --c-amber: #E2AE62; --c-amber-text: #E8B872; --c-amber-soft: #33281A;
      --c-success: #57B98A; --c-success-text: #6CC79A; --c-success-soft: #18342A;
      --c-danger: #E0847D; --c-danger-text: #EC9A93; --c-danger-soft: #3A2220;
      --c-hero-text-2: #CFE0D8; --c-focus: rgba(87,185,138,.4);
      --shadow-1: 0 1px 2px rgba(0,0,0,.3); --shadow-2: 0 10px 30px rgba(0,0,0,.45);
      color-scheme: dark;
    }
    :root[data-theme="dark"] .hero { background: #1D4A41; }
    :root[data-theme="dark"] .callout-icon, :root[data-theme="dark"] .btn-link, :root[data-theme="dark"] .lock-help button { color: var(--c-success-text); }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--c-bg); color: var(--c-text); font: var(--fw-regular) var(--fs-base)/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: var(--s-1); font-size: var(--fs-h1); line-height: 1.25; font-weight: var(--fw-bold); letter-spacing: -.01em; }
    h2 { margin-bottom: var(--s-1); font-size: var(--fs-lg); line-height: 1.35; font-weight: var(--fw-semibold); }
    h3 { margin-bottom: 2px; font-size: var(--fs-md); font-weight: var(--fw-semibold); }
    strong { font-weight: var(--fw-semibold); }
    .subtle { color: var(--c-text-2); }
    .eyebrow { margin: 0 0 var(--s-1); color: var(--c-text-2); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .num, .balance, .metric-value, .row-amount, td.amount, .figure { font-variant-numeric: tabular-nums; }

    /* ---------- App shell ---------- */
    .app-shell { min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
      padding: 10px max(16px, calc((100vw - 1120px) / 2)); background: color-mix(in srgb, var(--c-bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--c-border); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: var(--c-primary); color: var(--c-on-primary); font-weight: var(--fw-bold); font-size: 16px; }
    .brand-copy { line-height: 1.2; min-width: 0; }
    .brand-copy strong { display: block; font-size: var(--fs-md); font-weight: var(--fw-bold); }
    .brand-copy span { display: block; color: var(--c-text-2); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; align-items: center; gap: var(--s-2); }
    .device-pill { color: var(--c-text-2); font-size: var(--fs-xs); white-space: nowrap; }
    .bill-reminder-pill { display: none; white-space: nowrap; align-items: center; gap: 6px; min-height: 40px; padding: 4px 10px; border: 0; border-radius: var(--r-pill); color: var(--c-amber-text); background: var(--c-amber-soft); font-size: var(--fs-xs); font-weight: var(--fw-semibold); }
    .bill-reminder-pill.show { display: inline-flex; }
    .bill-reminder-pill:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-amber); }
    .connection-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--c-text-2); font-size: var(--fs-xs); white-space: nowrap; }
    .connection-pill:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-success); }
    .connection-pill.offline:before { background: var(--c-amber); }
    .layout { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: var(--s-6) 0 112px; }
    .view { display: none; animation: rise .2s ease both; }
    .view.active { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .app-notice { display: none; margin: 0 0 var(--s-4); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); color: var(--c-danger-text); background: var(--c-danger-soft); }
    .app-notice.show { display: block; }

    /* Desktop tabs */
    .nav { display: flex; gap: var(--s-1); flex-wrap: wrap; margin: 0 0 var(--s-6); padding: var(--s-1); width: fit-content; max-width: 100%; border-radius: var(--r-lg); background: var(--c-card); box-shadow: var(--shadow-1); }
    .nav button { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 40px; border: 0; border-radius: var(--r-md); padding: 8px 14px; color: var(--c-text-2); background: transparent; font-weight: var(--fw-medium); white-space: nowrap; }
    .nav button svg { width: 18px; height: 18px; }
    .nav button:hover { color: var(--c-text); background: var(--c-sage); }
    .nav button.active { color: var(--c-on-primary); background: var(--c-primary); }
    /* Mobile bottom navigation */
    .bottom-nav { position: fixed; right: 0; bottom: 0; left: 0; z-index: 18; display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--c-card); border-top: 1px solid var(--c-border); box-shadow: 0 -4px 16px rgba(24,59,53,.05); }
    .bottom-nav-inner { width: min(560px,100%); display: grid; grid-template-columns: repeat(5,1fr); gap: 2px; }
    .bottom-nav button { display: grid; justify-items: center; gap: 2px; min-height: 52px; border: 0; padding: 6px 2px; border-radius: var(--r-md); color: var(--c-text-2); background: transparent; font-size: var(--fs-xs); font-weight: var(--fw-medium); }
    .bottom-nav button svg { width: 22px; height: 22px; }
    .bottom-nav button.active { color: var(--c-primary); font-weight: var(--fw-semibold); }
    :root[data-theme="dark"] .bottom-nav button.active { color: var(--c-success-text); }
    .bottom-nav button.active .nav-icon { background: var(--c-sage); }
    .nav-icon { display: grid; place-items: center; width: 44px; height: 28px; border-radius: var(--r-pill); }
    .more-list { display: grid; gap: var(--s-2); }
    .more-list button { display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 60px; padding: var(--s-3); border: 1px solid var(--c-border); border-radius: var(--r-lg); background: var(--c-card); text-align: left; }
    .more-list button.active { border-color: var(--c-primary); }
    .more-list .row-icon svg { width: 20px; height: 20px; }
    .more-list strong { display: block; }
    .more-list span.subtle { display: block; font-size: var(--fs-sm); }

    /* ---------- Page structure ---------- */
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s-4); margin-bottom: var(--s-5); }
    .page-head .subtle { margin: 0; max-width: 560px; font-size: var(--fs-base); }
    .page-actions { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: flex-end; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); }
    .section-title h2 { margin: 0; }
    .section-title .subtle { display: block; font-size: var(--fs-sm); }
    .section-label { margin: var(--s-6) 0 var(--s-3); font-size: var(--fs-lg); font-weight: var(--fw-semibold); }
    .stack { display: grid; gap: var(--s-4); }
    .grid { display: grid; gap: var(--s-4); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .hero-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--s-4); margin-bottom: var(--s-4); }
    .grid > *, .list > *, .hero-grid > * { min-width: 0; }

    /* ---------- Cards ---------- */
    .card { background: var(--c-card); border: 1px solid var(--c-border); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: var(--s-5); }
    .card.soft { background: var(--c-sage); border-color: transparent; box-shadow: none; }
    .card.flat { box-shadow: none; }
    .hero { position: relative; overflow: hidden; padding: var(--s-6); border: 0; color: var(--c-on-primary); background: var(--c-primary); }
    .hero .eyebrow, .hero .balance-label { color: var(--c-hero-text-2); }
    .hero-greeting { margin: 0 0 var(--s-5); font-size: var(--fs-md); font-weight: var(--fw-medium); color: var(--c-on-primary); }
    .hero-name { color: var(--c-on-primary); font-weight: var(--fw-semibold); }
    .hero-tagline { margin: 0; color: var(--c-hero-text-2); font-size: var(--fs-sm); }
    .balance-label { color: var(--c-text-2); font-size: var(--fs-sm); }
    .balance { margin: 2px 0 var(--s-4); font-size: var(--fs-hero); font-weight: var(--fw-bold); line-height: 1.15; letter-spacing: -.01em; }
    .balance.negative { color: #F4C1BC; }
    .hero-stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-3); padding-top: var(--s-4); border-top: 1px solid rgba(255,255,255,.14); }
    .hero-stats > div > span { display: block; color: var(--c-hero-text-2); font-size: var(--fs-xs); }
    .hero-stats strong { font-size: var(--fs-md); }
    .hero-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); margin-top: var(--s-4); color: var(--c-hero-text-2); font-size: var(--fs-sm); }
    .hero .badge.good { color: #0F3B2A; background: #CDEBD9; }
    .hero .badge.bad { color: #5A1A16; background: #F6D2CE; }
    .safe-card .figure { display: block; margin: 2px 0 var(--s-1); font-size: var(--fs-hero); font-weight: var(--fw-bold); line-height: 1.15; color: var(--c-primary); }
    :root[data-theme="dark"] .safe-card .figure { color: var(--c-success-text); }
    .safe-card .figure.negative { color: var(--c-danger-text); }
    .metric { min-height: 0; }
    .metric .metric-label { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); color: var(--c-text-2); font-size: var(--fs-sm); }
    .metric-value { display: block; margin: var(--s-2) 0 2px; font-size: var(--fs-figure); font-weight: var(--fw-bold); line-height: 1.2; letter-spacing: -.01em; }
    .metric-value.green { color: var(--c-success-text); }
    .metric-value.red { color: var(--c-danger-text); }
    .metric-value.blue { color: var(--c-primary); }
    :root[data-theme="dark"] .metric-value.blue { color: var(--c-text); }
    .metric small { color: var(--c-text-2); font-size: var(--fs-sm); }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-3); }
    .pair > div { padding: var(--s-3); border-radius: var(--r-md); background: var(--c-bg); }
    .pair span { display: block; color: var(--c-text-2); font-size: var(--fs-sm); }
    .pair strong { display: block; margin-top: 2px; font-size: var(--fs-lg); }
    .quick-actions { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--s-2); margin-bottom: var(--s-4); }
    .quick-actions button { display: grid; justify-items: center; gap: 6px; min-height: 76px; padding: var(--s-3) var(--s-1); border: 1px solid var(--c-border); border-radius: var(--r-lg); background: var(--c-card); color: var(--c-text); font-size: var(--fs-sm); font-weight: var(--fw-medium); box-shadow: var(--shadow-1); }
    .quick-actions button svg { width: 22px; height: 22px; color: var(--c-primary); }
    :root[data-theme="dark"] .quick-actions button svg { color: var(--c-success-text); }
    .quick-actions button:hover { border-color: var(--c-sage-strong); background: var(--c-sage); }

    /* ---------- Buttons ---------- */
    .btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--touch); border: 1px solid var(--c-border-strong); border-radius: var(--r-md); padding: 10px 16px; color: var(--c-text); background: var(--c-card); font-weight: var(--fw-semibold); line-height: 1.2; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s; }
    .btn:hover { background: var(--c-sage); border-color: var(--c-sage-strong); }
    .btn.primary, .btn.dark { color: var(--c-on-primary); background: var(--c-primary); border-color: var(--c-primary); }
    .btn.primary:hover, .btn.dark:hover { background: var(--c-primary-hover); border-color: var(--c-primary-hover); }
    .btn.danger { color: var(--c-danger-text); background: var(--c-danger-soft); border-color: transparent; }
    .btn.danger:hover { background: #F3D8D5; }
    .btn.small { min-height: 38px; padding: 7px 12px; border-radius: var(--r-sm); font-size: var(--fs-sm); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-link { display: inline; min-height: 0; border: 0; padding: 0; background: transparent; color: var(--c-primary); font-weight: var(--fw-semibold); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
    :root[data-theme="dark"] .btn-link { color: var(--c-success-text); }
    .section-title .btn-link { display: inline-flex; align-items: center; min-height: 40px; padding: 0 2px 0 8px; text-decoration: none; font-size: var(--fs-sm); flex: 0 0 auto; }
    .safe-card .btn-link { display: inline-flex; align-items: center; min-height: 40px; }
    .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
    .form-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-4); }

    /* ---------- Badges, chips, dots ---------- */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap; }
    .badge.good { color: var(--c-success-text); background: var(--c-success-soft); }
    .badge.warn { color: var(--c-amber-text); background: var(--c-amber-soft); }
    .badge.bad { color: var(--c-danger-text); background: var(--c-danger-soft); }
    .badge.neutral { color: var(--c-text); background: var(--c-sage); }
    .category-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-pill); background: var(--c-sage); color: var(--c-text); font-size: var(--fs-xs); font-weight: var(--fw-medium); }
    .dot { width: 8px; height: 8px; display: inline-block; flex: 0 0 auto; border-radius: 50%; background: var(--c-success); }
    .dot.red { background: var(--c-danger); } .dot.blue { background: var(--c-primary); } .dot.amber { background: var(--c-amber); }

    /* ---------- Progress ---------- */
    .progress { height: 8px; overflow: hidden; border-radius: var(--r-pill); background: var(--c-sage); }
    :root[data-theme="dark"] .progress { background: #26372F; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--c-success); transition: width .35s ease; }
    .progress.blue > span { background: var(--c-primary); }
    :root[data-theme="dark"] .progress.blue > span { background: var(--c-success); }
    .progress.red > span { background: var(--c-danger); }
    .progress-meta { display: flex; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-2); color: var(--c-text-2); font-size: var(--fs-sm); }

    /* ---------- Lists ---------- */
    .list { display: grid; gap: 0; }
    .list-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--c-border); }
    .list-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .list-row:first-child { padding-top: 0; }
    .row-icon { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--c-sage); color: var(--c-primary); font-size: 16px; font-weight: var(--fw-semibold); }
    :root[data-theme="dark"] .row-icon { color: var(--c-text); }
    .row-icon.income { color: var(--c-success-text); background: var(--c-success-soft); }
    .row-icon.bill { color: var(--c-amber-text); background: var(--c-amber-soft); }
    .row-icon.expense { color: var(--c-danger-text); background: var(--c-danger-soft); }
    .row-main { min-width: 0; flex: 1; }
    .row-main strong, .row-main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-main strong { font-size: var(--fs-base); font-weight: var(--fw-medium); }
    .row-main span { color: var(--c-text-2); font-size: var(--fs-sm); }
    .row-amount { flex: 0 0 auto; text-align: right; font-weight: var(--fw-semibold); }
    .row-amount.income, .amount.income { color: var(--c-success-text); }
    .row-amount.expense, .amount.expense { color: var(--c-danger-text); }
    .row-amount.transfer, .amount.transfer { color: var(--c-text-2); }
    .row-amount.borrow, .amount.borrow { color: var(--c-primary); }
    :root[data-theme="dark"] .row-amount.borrow, :root[data-theme="dark"] .amount.borrow { color: var(--c-text); }
    .tx-row { flex-wrap: wrap; }
    .tx-row .actions { width: 100%; justify-content: flex-end; padding-left: 52px; }
    .tx-row .row-sub { display: block; margin-top: 2px; color: var(--c-text-2); font-size: var(--fs-xs); white-space: normal; }
    .empty { padding: var(--s-6) var(--s-2); color: var(--c-text-2); text-align: center; }
    .empty strong { display: block; margin-bottom: var(--s-1); color: var(--c-text); font-size: var(--fs-md); }
    .kv { display: grid; gap: var(--s-2); }
    .kv > div { display: flex; justify-content: space-between; gap: var(--s-4); color: var(--c-text-2); font-size: var(--fs-base); }
    .kv > div strong { color: var(--c-text); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .kv > div.total { padding-top: var(--s-2); border-top: 1px solid var(--c-border); color: var(--c-text); font-weight: var(--fw-semibold); }
    .split { display: flex; justify-content: space-between; gap: var(--s-3); align-items: center; }
    .budget-line { display: grid; gap: var(--s-2); margin: var(--s-4) 0; }
    .budget-line .split { font-size: var(--fs-sm); }

    /* ---------- Callouts ---------- */
    .callout { display: flex; gap: var(--s-3); padding: var(--s-3) var(--s-4); margin-top: var(--s-3); border-radius: var(--r-md); background: var(--c-sage); color: var(--c-text); font-size: var(--fs-sm); line-height: 1.5; }
    .callout.warn { background: var(--c-amber-soft); }
    .callout.bad { background: var(--c-danger-soft); }
    .callout.good { background: var(--c-success-soft); }
    .callout-icon { width: 22px; height: 22px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--c-card); color: var(--c-primary); font-size: var(--fs-xs); font-weight: var(--fw-bold); }
    .callout.warn .callout-icon { color: var(--c-amber-text); }
    .callout.bad .callout-icon { color: var(--c-danger-text); }
    .callout.good .callout-icon { color: var(--c-success-text); }
    .goal-warning, .account-card .warn-text { color: var(--c-amber-text); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    .steps { margin: var(--s-2) 0 0; padding-left: 20px; color: var(--c-text); font-size: var(--fs-sm); }
    .steps li { margin-bottom: 6px; }

    /* ---------- Forms ---------- */
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: var(--s-4); }
    .field { display: grid; gap: 6px; align-content: start; }
    .field.full { grid-column: 1/-1; }
    label { color: var(--c-text); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    input, select, textarea { width: 100%; min-height: 46px; border: 1px solid var(--c-border-strong); border-radius: var(--r-md); padding: 10px 12px; color: var(--c-text); background: var(--c-card); font-size: var(--fs-md); outline: none; }
    input[type="checkbox"] { width: 20px; min-height: 20px; height: 20px; padding: 0; accent-color: var(--c-primary); vertical-align: -4px; }
    input:focus, select:focus, textarea:focus { border-color: var(--c-success); box-shadow: 0 0 0 3px var(--c-focus); }
    textarea { min-height: 80px; resize: vertical; }
    .field small, .form-grid small { font-size: var(--fs-sm); }
    .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s-3); margin-bottom: var(--s-4); }
    .toolbar .field.search { grid-column: 1/-1; }
    .filters { margin-bottom: var(--s-3); }
    .filters > summary { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r-pill); background: var(--c-sage); color: var(--c-text); font-size: var(--fs-sm); font-weight: var(--fw-semibold); cursor: pointer; list-style: none; }
    .filters > summary::-webkit-details-marker { display: none; }
    .filters[open] > summary { margin-bottom: var(--s-3); }
    .amount-presets { display: flex; flex-wrap: wrap; gap: var(--s-2); }
    .amount-presets button { min-height: 38px; border: 1px solid var(--c-border-strong); border-radius: var(--r-pill); padding: 6px 14px; color: var(--c-text); background: var(--c-card); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    .amount-presets button:hover { border-color: var(--c-success); background: var(--c-sage); }
    .inline-error { display: none; margin: var(--s-2) 0 0; color: var(--c-danger-text); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    .inline-error.show { display: block; }

    /* ---------- Tables (history dialogs, desktop) ---------- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 520px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--c-border); text-align: left; vertical-align: middle; }
    th { color: var(--c-text-2); font-size: var(--fs-xs); font-weight: var(--fw-semibold); }
    td { font-size: var(--fs-sm); }
    td.amount { font-weight: var(--fw-semibold); }

    /* ---------- Accounts ---------- */
    .account-card { padding: var(--s-4); }
    .account-head { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
    .account-head .row-icon { width: 36px; height: 36px; }
    .account-head strong { display: block; font-size: var(--fs-md); }
    .account-head span { display: block; color: var(--c-text-2); font-size: var(--fs-xs); }
    .account-figures { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-2) var(--s-3); }
    .account-figures div { min-width: 0; }
    .account-figures span { display: block; color: var(--c-text-2); font-size: var(--fs-xs); }
    .account-figures strong { display: block; font-size: var(--fs-base); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-figures .main { grid-column: 1/-1; }
    .account-figures .main strong { font-size: 22px; font-weight: var(--fw-bold); }
    .section-title > .btn { flex: 0 0 auto; }
    .account-card small { display: block; margin-top: var(--s-2); }
    .account-card .form-actions { margin-top: var(--s-3); justify-content: flex-start; }
    .holdings { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-3); }
    .holdings span { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-pill); padding: 4px 10px; background: var(--c-bg); border: 1px solid var(--c-border); font-size: var(--fs-xs); }

    /* ---------- Bills calendar, reminders ---------- */
    .bill-reminders { margin-bottom: var(--s-4); }
    .bill-reminder-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--c-border); }
    .bill-reminder-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .bill-reminder-row:first-child { padding-top: 0; }
    .reminder-copy { min-width: 0; flex: 1; }
    .reminder-copy strong, .reminder-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reminder-copy span { color: var(--c-text-2); font-size: var(--fs-sm); }
    .countdown-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; padding: 4px 8px; border-radius: var(--r-pill); color: var(--c-amber-text); background: var(--c-amber-soft); font-size: var(--fs-xs); font-weight: var(--fw-semibold); }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
    .calendar-head { color: var(--c-text-2); font-size: var(--fs-xs); font-weight: var(--fw-medium); text-align: center; }
    .calendar-cell { min-height: 64px; padding: 6px; border-radius: var(--r-sm); background: var(--c-bg); }
    .calendar-cell.muted { opacity: .45; }
    .calendar-cell.today { box-shadow: inset 0 0 0 2px var(--c-success); }
    .calendar-day { display: block; margin-bottom: 4px; color: var(--c-text-2); font-size: var(--fs-xs); font-weight: var(--fw-medium); }
    .calendar-event { display: block; overflow: hidden; margin-top: 3px; padding: 2px 4px; border-radius: 4px; color: var(--c-amber-text); background: var(--c-amber-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .calendar-event.paid { color: var(--c-success-text); background: var(--c-success-soft); }

    /* ---------- Reports ---------- */
    .score { display: flex; align-items: center; gap: var(--s-4); }
    .score-number { width: 76px; height: 76px; display: grid; place-items: center; flex: 0 0 auto; border: 7px solid var(--c-sage); border-right-color: var(--c-success); border-top-color: var(--c-success); border-radius: 50%; color: var(--c-text); font-size: 22px; font-weight: var(--fw-bold); }
    .insight-list { display: grid; gap: var(--s-2); }
    .insight { display: flex; gap: var(--s-3); padding: var(--s-3); border-radius: var(--r-md); background: var(--c-bg); }
    .insight strong { display: block; margin-bottom: 2px; }
    .insight span { color: var(--c-text-2); font-size: var(--fs-sm); }
    .trend-bars { display: grid; grid-template-columns: repeat(6,1fr); gap: var(--s-3); align-items: end; height: 150px; padding-top: var(--s-3); }
    .trend-col { display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; text-align: center; }
    .trend-bar-wrap { display: flex; align-items: end; justify-content: center; height: 100%; }
    .trend-bar { width: min(28px,70%); min-height: 3px; border-radius: 6px 6px 2px 2px; background: var(--c-primary); opacity: .85; }
    :root[data-theme="dark"] .trend-bar { background: var(--c-success); }
    .trend-col span { color: var(--c-text-2); font-size: var(--fs-xs); }
    .focus-card { background: var(--c-sage); border-color: transparent; box-shadow: none; }
    .focus-kicker { color: var(--c-text-2); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    .focus-card h2 { margin: var(--s-2) 0 var(--s-1); }
    .focus-card p { margin-bottom: var(--s-3); color: var(--c-text); }

    /* ---------- Dialogs ---------- */
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: var(--s-4); background: rgba(16,29,26,.45); backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(600px,100%); max-height: min(90vh, 780px); overflow: auto; overscroll-behavior: contain; padding: var(--s-6) var(--s-6) calc(var(--s-6) + env(safe-area-inset-bottom)); border-radius: var(--r-xl); background: var(--c-card); box-shadow: var(--shadow-2); animation: modal-in .2s ease both; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-4); }
    .modal-head .eyebrow { display: none; }
    .modal-head h2 { font-size: 19px; }
    .close { width: var(--touch); height: var(--touch); flex: 0 0 auto; border: 0; border-radius: 50%; background: var(--c-sage); color: var(--c-text); font-size: 22px; line-height: 1; }
    .modal .form-actions .btn { min-height: 48px; }

    /* ---------- Lock & splash ---------- */
    .lock-screen { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: var(--s-5); background: var(--c-primary); color: var(--c-on-primary); }
    .lock-screen.hidden { display: none; }
    .lock-card { width: min(360px,100%); padding: var(--s-8) var(--s-6); border-radius: 24px; text-align: center; background: var(--c-card); color: var(--c-text); box-shadow: var(--shadow-2); }
    .lock-card h2 { font-size: 20px; }
    .pin-dots { display: flex; justify-content: center; gap: 12px; margin: var(--s-5) 0 var(--s-2); }
    .pin-dot { width: 13px; height: 13px; border: 2px solid var(--c-border-strong); border-radius: 50%; }
    .pin-dot.filled { background: var(--c-primary); border-color: var(--c-primary); }
    .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pin-keypad button { height: 56px; border: 0; border-radius: var(--r-lg); color: var(--c-text); background: var(--c-bg); font-size: 20px; font-weight: var(--fw-semibold); }
    .pin-keypad button[data-pin="clear"], .pin-keypad button[data-pin="back"] { font-size: var(--fs-sm); color: var(--c-text-2); }
    .pin-keypad button:hover, .pin-keypad button:active { background: var(--c-sage); }
    .lock-note { min-height: 22px; margin-bottom: var(--s-2); color: var(--c-danger-text); font-size: var(--fs-sm); }
    .lock-help { margin: var(--s-4) 0 0; color: var(--c-text-2); font-size: var(--fs-sm); }
    .lock-help button { min-height: 32px; border: 0; padding: 0; color: var(--c-primary); background: transparent; font-weight: var(--fw-semibold); text-decoration: underline; }
    .splash-screen { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; align-content: center; gap: var(--s-2); padding: var(--s-6); color: var(--c-on-primary); background: var(--c-primary); transition: opacity .35s ease, visibility .35s ease; }
    .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-title { margin: 0; font-size: 28px; font-weight: var(--fw-bold); }
    .splash-subtitle { color: var(--c-hero-text-2); font-size: var(--fs-base); }
    .toast { position: fixed; right: 16px; bottom: 92px; z-index: 80; max-width: min(380px,calc(100% - 32px)); display: none; padding: var(--s-3) var(--s-4); border-radius: var(--r-md); color: #FFFFFF; background: #183B35; box-shadow: var(--shadow-2); font-size: var(--fs-base); }
    .toast.show { display: block; animation: rise .2s ease both; }
    .marketing-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); margin-top: var(--s-8); padding: var(--s-4) 2px; color: var(--c-text-2); font-size: var(--fs-xs); }
    .marketing-footer-brand { display: inline-flex; align-items: center; gap: var(--s-2); }
    .privacy-consent { display: none; }
    .hide-mobile { display: initial; }

    /* ---------- Small screens ---------- */
    @media (max-width: 760px) {
      .layout { width: calc(100% - 24px); padding-top: var(--s-4); }
      .topbar { padding: 8px 12px; }
      .device-pill, .connection-pill, .nav { display: none; }
      .page-head { align-items: stretch; flex-direction: column; gap: var(--s-3); margin-bottom: var(--s-4); }
      .page-actions { justify-content: stretch; }
      .page-actions .btn { flex: 1 1 0; }
      .page-actions .field { flex: 1 1 100%; }
      .hero-grid, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .grid { gap: var(--s-3); }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .hide-mobile { display: none; }
      .card { padding: var(--s-4); }
      .hero { padding: var(--s-5); }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal { width: 100%; max-height: 92dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: var(--s-5) var(--s-4) calc(var(--s-5) + env(safe-area-inset-bottom)); }
      .modal .form-actions .btn { flex: 1 1 130px; }
      .marketing-footer { flex-direction: column; align-items: flex-start; gap: var(--s-1); }
      /* Summary figures become compact rows: label on the left, amount on the right. */
      .grid:has(> .metric) { gap: var(--s-2); }
      .grid > .metric { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; column-gap: var(--s-3); padding: var(--s-3) var(--s-4); }
      .grid > .metric .metric-label { grid-column: 1; }
      .grid > .metric .metric-label .dot { display: none; }
      .grid > .metric .metric-value { grid-column: 2; grid-row: 1 / span 2; margin: 0; font-size: 18px; white-space: nowrap; }
      .grid > .metric small { grid-column: 1; font-size: var(--fs-xs); }
      .expected-row { flex-wrap: wrap; }
      .expected-row .actions { width: 100%; justify-content: flex-end; }
    }
    @media (max-width: 380px) { .brand-copy span { display: none; } }
    @media (max-width: 440px) {
      .list-row:has(> .badge) { flex-wrap: wrap; row-gap: 6px; }
      .list-row > .badge { order: 3; margin-left: 52px; }
      .list-row > .actions { order: 4; }
      .tx-row > .badge + .row-amount + .actions, .tx-row > .badge ~ .actions { width: auto; margin-left: auto; padding-left: 0; }
    }
    @media (max-width: 360px) {
      .quick-actions { gap: 6px; }
      .quick-actions button { font-size: var(--fs-xs); }
      .balance, .safe-card .figure { font-size: 26px; }
    }
    @media (min-width: 761px) { .bottom-nav { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="splashScreen" class="splash-screen" role="status" aria-label="Opening PesaPilot">
    <strong class="splash-title">PesaPilot</strong>
    <span class="splash-subtitle">Your money, made clear</span>
  </div>
  <div id="lockScreen" class="lock-screen hidden" role="dialog" aria-modal="true" aria-labelledby="lockTitle" aria-describedby="lockDescription">
    <div class="lock-card">
      <h2 id="lockTitle">PesaPilot is locked</h2>
      <p id="lockDescription" class="subtle">Enter your PIN on this protected device.</p>
      <div id="pinDots" class="pin-dots"></div>
      <div id="pinNote" class="lock-note"></div>
      <div class="pin-keypad">
        <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
        <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
        <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
        <button data-pin="clear">Clear</button><button data-pin="0">0</button><button data-pin="back">⌫</button>
      </div>
      <p class="lock-help">Forgot your PIN? <button type="button" data-action="forgot-pin">See recovery steps</button></p>
    </div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">P</div><div class="brand-copy"><strong>PesaPilot</strong><span>Your money, made clear</span></div></div>
      <div class="topbar-actions"><button type="button" id="billReminderPill" class="bill-reminder-pill" data-action="view-bills"></button><div id="connectionPill" class="connection-pill">Online</div><div id="devicePill" class="device-pill">Private on this device</div></div>
    </header>
    <main class="layout">
      <nav id="desktopNav" class="nav"></nav>
       <div id="appNotice" class="app-notice" role="alert"></div>
      <section id="homeView" class="view active"></section>
      <section id="moneyView" class="view"></section>
      <section id="planView" class="view"></section>
      <section id="goalsView" class="view"></section>
      <section id="billsView" class="view"></section>
      <section id="debtsView" class="view"></section>
      <section id="reportsView" class="view"></section>
      <section id="settingsView" class="view"></section>
     <footer class="marketing-footer">
        <div class="marketing-footer-brand"><span>Money planning by Degum Enterprises</span></div>
        <div>PesaPilot · Degum Enterprises</div>
      </footer>
    </main>
    <nav class="bottom-nav"><div id="mobileNav" class="bottom-nav-inner"></div></nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";
    const STORAGE_KEY = "pesapilot_v2";
    const DEVICE_KEY = "pesapilot_device_id";
    const ONBOARDING_KEY = "pesapilot_onboarding_v1";
      const SAFETY_BACKUP_KEY = "pesapilot_safety_backup_v9";
       const SCHEMA_VERSION = 10;
     const BACKUP_VERSION = 4;
     // Untouched copy of the data exactly as it was before the schema 10 (accounts) upgrade.
     // Written once and never overwritten, so the upgrade can always be reversed.
     const PRE_V10_KEY = "pesapilot_pre_v10_snapshot";
    const navItems = [
      ["home","Home","⌂"],["money","Money","₿"],["plan","Plan","◌"],["goals","Savings","◎"],
      ["bills","Bills","▣"],["debts","Debts","↗"],["reports","Reports","▤"],["settings","Settings","⚙"]
    ];
    const defaultCategories = ["Food","Transport","Housing","Utilities","Health","Shopping","Entertainment","Family","Education","Other"];
    const paymentMethods = ["M-Pesa","Cash","Bank","Card","Other"];
    const accountKinds = [["mpesa","M-Pesa"],["cash","Cash"],["bank","Bank account"],["savings","Savings (M-Shwari, SACCO, savings account)"],["other","Other"]];
    // How each transaction kind moves money. Transfers move between two accounts.
    // Only income counts as earnings and only expense counts as spending.
    const INFLOW_KINDS = { income:true, borrow:true };
    const OUTFLOW_KINDS = { expense:true, debt_repayment:true };
    let activeView = "home";
     let reportMonth = "";
      let billMonth = "";
      let billMonthWasSelected = false;
    let transactionFilters = { search:"", type:"all", category:"all", account:"all", from:"", to:"", sort:"date-desc" };
    let transactionLimit = 30;
    let pinInput = "";
     let unlocked = false;
      let modalReturnFocus = null;
      let deferredInstallPrompt = null;
     let storageWarning = "";
     let storageReadOnly = false;
     let state;

    const $ = id => document.getElementById(id);
     const currencyConfig = () => ({
       KSh: { label:"KSh", locale:"en-KE" },
       USD: { label:"$", locale:"en-US" },
       UGX: { label:"UGX", locale:"en-UG" },
       TZS: { label:"TSh", locale:"sw-TZ" }
     }[state?.profile?.currency] || { label:"KSh", locale:"en-KE" });
     const money = value => {
       const number = Number(value) || 0, config = currencyConfig();
       return `${number < 0 ? "−" : ""}${config.label} ${Math.abs(Math.round(number)).toLocaleString(config.locale)}`;
     };
     const plainMoney = value => {
       const config = currencyConfig();
       return `${config.label} ${Math.abs(Math.round(Number(value)||0)).toLocaleString(config.locale)}`;
     };

ney(pace.projected)}</strong></div><div><span>Days counted</span><strong>${pace.elapsed} of ${pace.daysInMonth}</strong></div>${state.budgets.monthlySpending?`<div><span>Budget headroom</span><strong class="${state.budgets.monthlySpending-pace.projected<0?"red":"green"}">${money(state.budgets.monthlySpending-pace.projected)}</strong></div>`:""}</div></div></div><div class="grid grid-2" style="margin-bottom:15px"><div class="card"><div class="section-title"><h2>Top spending categories</h2><span class="subtle">${monthLabel(reportMonth)}</span></div>${top.length?top.map(([name,amount])=>`<div class="budget-line"><div class="split"><span>${escapeHtml(name)}</span><strong>${money(amount)}</strong></div><div class="progress"><span style="width:${current.expense?amount/current.expense*100:0}%"></span></div><div class="progress-meta"><span>${current.expense?Math.round(amount/current.expense*100):0}% of expenses</span><strong>${prevCats[name]!==undefined?`${changeLabel(amount-prevCats[name])}`:"New"}</strong></div></div>`).join(""):emptyState("No expenses this month","Your category report will appear as you record spending.")}</div><div class="card"><div class="section-title"><h2>Largest transactions</h2></div>${largest.length?`<div class="list">${largest.map(transactionRow).join("")}</div>`:emptyState("No large transactions","Record expenses to see where the biggest amounts went.")}</div></div><div class="grid grid-2"><div class="card"><div class="section-title"><h2>Monthly summary</h2></div><div class="kv"><div><span>Previous expenses</span><strong>${money(previous.expense)}</strong></div><div><span>Change in expenses</span><strong class="${change>0?"red":"green"}">${change>0?"+":"−"}${plainMoney(Math.abs(change))}</strong></div><div><span>Bills paid in ${monthLabel(reportMonth)}</span><strong>${money(reportBillsPaid)}</strong></div><div><span>Unpaid bills protected</span><strong>${money(sum(unpaidBills(),bill=>billOutstanding(bill)))}</strong></div><div><span>Debt repayments in ${monthLabel(reportMonth)}</span><strong>${money(reportDebtRepayments)}</strong></div><div><span>Largest category</span><strong>${escapeHtml(top[0]?.[0]||"—")}</strong></div></div><div class="callout ${change>0?"warn":"good"}" style="margin-top:17px"><span class="callout-icon">${change>0?"!":"✓"}</span><span>${change>0?`Expenses are ${money(change)} higher than last month. Focus first on ${escapeHtml(top[0]?.[0]||"your largest category")}.`:"Expenses are holding steady or lower than last month. Keep protecting your commitments."}</span></div></div><div class="card"><div class="section-title"><h2>Spending trend guide</h2></div><p class="subtle">Use the forecast with your bills and payday plan. It is a planning signal, not a guarantee, and becomes more useful as you record more transactions.</p></div></div>`;
       $("reportMonth").onchange=event=>{reportMonth=event.target.value;renderReports();};

    function emptyState(title,description) { return `<div class="empty"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(description)}</span></div>`; }
     function openModal(title,body) { modalReturnFocus=document.activeElement; $("modal").innerHTML=`<div class="modal-head"><div><p class="eyebrow">PesaPilot</p><h2 id="modalTitle">${title}</h2></div><button type="button" class="close" aria-label="Close dialog" data-action="close-modal">×</button></div>${body}`; $("modalBackdrop").classList.add("open"); $("modalBackdrop").setAttribute("aria-hidden","false"); bindActions(); requestAnimationFrame(()=>{$("modal").querySelector("input,select,textarea,button")?.focus();}); }
     function closeModal() { $("modalBackdrop").classList.remove("open"); $("modalBackdrop").setAttribute("aria-hidden","true"); $("modal").innerHTML=""; if(modalReturnFocus?.focus)modalReturnFocus.focus(); modalReturnFocus=null; }
    function inputField(label,id,type="text",value="",extra="",full=false) { return `<div class="field ${full?"full":""}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHtml(value)}" ${extra}/></div>`; }
    function transactionForm(item=null,type="expense") {
      if(item&&(isAudited(item)||isReversalPair(item))){toast("Adjustments can't be edited. Reverse it, then reconcile again if needed.");return;}
      const kind=item ? item.type : type;
      if (kind==="transfer") return transferForm(item);
      if (!["income","expense","borrow","debt_repayment"].includes(kind)) { toast("This entry was created by a newer version of PesaPilot and cannot be edited here."); return; }
      const income=kind==="income", fixedCategory=kind==="borrow"||kind==="debt_repayment", linked=isLinkedReference(item?.reference);
      const selectedCategory=item?.category||(income?"Income":"Food"), selectedAccount=accountById(item?.accountId)?item.accountId:defaultAccountId();
      const title=item?(kind==="borrow"?"Edit borrowed money":kind==="debt_repayment"?"Edit debt repayment":"Edit transaction"):`Add ${income?"income":"expense"}`;
      const hint=income?"Income is added to the account you choose.":kind==="expense"?"Spending reduces the account you choose. To save for a goal use Goals, and to move money between your own accounts use Transfer.":kind==="borrow"?"Borrowed money increases the account but is not income.":"A debt repayment reduces the account and the debt. It is not counted as spending.";
      openModal(title,`<form id="transactionForm" class="form-grid">${inputField("Amount ("+currencyConfig().label+")","txAmount","number",item?.amount||"","min=\"0\" step=\"0.01\" required")}${kind==="expense"&&!item?`<div class="field full"><label>Quick amounts</label><div class="amount-presets">${[100,250,500,1000].map(amount=>`<button type="button" data-amount="${amount}">${plainMoney(amount)}</button>`).join("")}</div></div>`:""}${inputField("Date","txDate","date",item?.date||todayISO(),"required")}${fixedCategory?"":`<div class="field"><label for="txCategoryForm">Category</label><select id="txCategoryForm" required>${categoryOptionsWithFallback(selectedCategory)}</select></div>`}<div class="field"><label for="txAccountForm">${income||kind==="borrow"?"Received into":"Paid from"}</label><select id="txAccountForm" required>${accountOptions(selectedAccount)}</select></div>${linked?"":inputField("Reference (optional)","txReference","text",item?.reference||"","placeholder=\"M-Pesa code, receipt or till number\"")}${inputField("Description / note","txNotes","text",item?.notes||item?.description||"","placeholder=\"What was this for?\"",true)}<div class="field full"><small class="subtle">${hint}${linked?" This entry belongs to a bill or debt, which will be updated too.":""}</small></div><div class="field full form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">${item?"Save changes":"Add entry"}</button></div></form>`);
      document.querySelectorAll("[data-amount]").forEach(button=>button.onclick=()=>{$("txAmount").value=button.dataset.amount;$("txAmount").focus();});
      $("transactionForm").onsubmit=event=>{
        event.preventDefault();
        const amount=roundMoney(safeNumber($("txAmount").value)), accountId=$("txAccountForm").value;
        if(amount<=0){toast("Enter an amount greater than zero.");return;}
        if(!accountById(accountId)){toast("Choose an account.");return;}
        const link=item?linkedRecord(item):{kind:""};
        if(link.kind==="debt"&&link.debt){const others=roundMoney(sum(link.debt.repayments||[],entry=>entry===link.entry?0:entry.amount)+(Number(link.debt.repaidBeforeTracking)||0));if(others+amount>link.debt.total+0.005){toast(`That is more than the ${money(link.debt.total-others)} left on ${link.debt.name}.`);return;}}
        if(link.kind==="goaluse"&&link.goal){const available=roundMoney(goalSaved(link.goal)+(Number(item.amount)||0));if(amount>available+0.005){toast(`Only ${money(available)} is saved in ${link.goal.name}.`);return;}}
        if(link.kind==="bill"&&link.bill&&link.entry){const others=sum((link.bill.payments||[]).filter(entry=>entry!==link.entry&&entry.occurrenceDate===link.entry.occurrenceDate),entry=>entry.amount);if(others+amount>link.bill.amount+0.005){toast(`That is more than the ${money(link.bill.amount-others)} due for this bill occurrence.`);return;}}
        if(OUTFLOW_KINDS[kind]&&!confirmOutflow(accountId,amount,item))return;
        const category=fixedCategory?(item?.category||(kind==="borrow"?"Borrowed":"Debt repayment")):($("txCategoryForm").value.trim()||"Other");
        const entry={type:kind,amount,date:$("txDate").value||todayISO(),category,accountId,paymentMethod:accountName(accountId),reference:linked?item.reference:$("txReference").value.trim(),notes:$("txNotes").value.trim(),description:$("txNotes").value.trim(),updatedAt:new Date().toISOString()};
        if(item){Object.assign(item,entry);syncLinkedFromTransaction(item);}else state.transactions.push({id:id(),...entry,createdAt:new Date().toISOString()});
        if(!fixedCategory&&!state.categories.some(x=>x.name.toLowerCase()===entry.category.toLowerCase()))state.categories.push({id:entry.category.toLowerCase(),name:entry.category});
        closeModal();commit(item?"Transaction updated":"Transaction added");
      };
    }
    function transferForm(item=null,presetGoalId="") {
      const active=state.accounts.filter(account=>!account.archived);
      if(!item&&active.length<2){toast("Add a second account first, for example M-Shwari or a bank account.");return accountForm();}
      const goal=presetGoalId?state.goals.find(entry=>String(entry.id)===String(presetGoalId)):null;
      const goalSource=goal?[...goalHoldings(goal)].sort((a,b)=>b.amount-a.amount)[0]?.account.id:"";
      const from=item?.accountId||goalSource||defaultAccountId();
      const to=item?.toAccountId||(active.find(account=>account.id!==from&&(!goal||account.kind==="savings"))||active.find(account=>account.id!==from))?.id||"";
      const goalId=item?(item.goalId??""):(goal?goal.id:"");
      openModal(item?"Edit transfer":goal?`Move money for ${escapeHtml(goal.name)}`:"Move money between accounts",`<form id="transferForm" class="form-grid">${inputField("Amount ("+currencyConfig().label+")","trAmount","number",item?.amount||"","min=\"0\" step=\"0.01\" required")}${inputField("Date","trDate","date",item?.date||todayISO(),"required")}<div class="field"><label for="trFrom">From</label><select id="trFrom" required>${accountOptions(from)}</select></div><div class="field"><label for="trTo">To</label><select id="trTo" required>${accountOptions(to)}</select></div><div class="field full"><label for="trGoal">Is this money for a goal?</label><select id="trGoal"><option value="">No, just moving money</option>${state.goals.map(entry=>`<option value="${escapeHtml(entry.id)}" ${String(entry.id)===String(goalId)?"selected":""}>Yes: ${escapeHtml(entry.name)}</option>`).join("")}</select></div>${inputField("Note","trNotes","text",item?.notes||"","placeholder=\"e.g. Monthly saving to M-Shwari\"",true)}<div class="field full"><small class="subtle">A transfer changes where your money is, not how much you have. It is never counted as income or spending. For a goal, the moved amount stays set aside for that goal in the receiving account.</small></div><div class="field full form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">${item?"Save changes":"Move money"}</button></div></form>`);
      $("transferForm").onsubmit=event=>{
        event.preventDefault();
        const amount=roundMoney(safeNumber($("trAmount").value)), fromId=$("trFrom").value, toId=$("trTo").value, chosenGoal=state.goals.find(entry=>String(entry.id)===$("trGoal").value)||null;
        if(amount<=0){toast("Enter an amount greater than zero.");return;}
        if(!accountById(fromId)||!accountById(toId)){toast("Choose both accounts.");return;}
        if(fromId===toId){toast("Choose two different accounts.");return;}
        const reference=item?`transfer:${item.id}`:"";
        const saved={transactions:state.transactions,allocations:state.allocations};
        if(item){state.transactions=state.transactions.filter(entry=>entry!==item);state.allocations=state.allocations.filter(entry=>entry.reference!==reference);}
        const release=chosenGoal?Math.min(amount,Math.max(0,goalOnAccount(chosenGoal.id,fromId))):0, balance=accountBalance(fromId), available=accountAvailable(fromId);
        state.transactions=saved.transactions;state.allocations=saved.allocations;
        let proceed=true;
        if(amount>balance+0.005)proceed=confirm(`This is more than the ${money(balance)} PesaPilot shows in ${accountName(fromId)}. Move it anyway? If the balance is wrong, correct the account's opening balance.`);
        else if(amount>available+release+0.005)proceed=confirm(`${money(amount-Math.max(0,available)-release)} of this is set aside for other goals in ${accountName(fromId)}. Move it anyway? Those goals will show a shortfall.`);
        if(!proceed)return;
        const values={type:"transfer",amount,date:$("trDate").value||todayISO(),accountId:fromId,toAccountId:toId,goalId:chosenGoal?chosenGoal.id:undefined,category:"Transfer",paymentMethod:accountName(fromId),notes:$("trNotes").value.trim(),description:$("trNotes").value.trim(),updatedAt:new Date().toISOString()};
        let transfer=item;
        if(item){state.allocations=state.allocations.filter(entry=>entry.reference!==reference);Object.assign(item,values);if(!chosenGoal)delete item.goalId;}
        else{transfer={id:id(),...values,reference:"",createdAt:new Date().toISOString()};if(!chosenGoal)delete transfer.goalId;state.transactions.push(transfer);}
        if(chosenGoal){
          const ref=`transfer:${transfer.id}`;
          if(release>0)state.allocations.push({id:id(),goalId:chosenGoal.id,accountId:fromId,amount:-release,date:values.date,note:`Moved to ${accountName(toId)}`,reference:ref});
          state.allocations.push({id:id(),goalId:chosenGoal.id,accountId:toId,amount,date:values.date,note:`Moved from ${accountName(fromId)}`,reference:ref});
        }
        closeModal();commit(item?"Transfer updated":chosenGoal?`Moved to ${accountName(toId)} for ${chosenGoal.name}`:"Transfer recorded");
      };
    }

     function monthlyCycleDate(dateValue,month=currentMonth()) {
       const source=new Date(`${dateValue||todayISO()}T12:00:00`);
       const target=new Date(`${month}-01T12:00:00`);
       if (Number.isNaN(source.getTime()) || Number.isNaN(target.getTime())) return dateValue||todayISO();
       const lastDay=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
       return `${month}-${String(Math.min(source.getDate(),lastDay)).padStart(2,"0")}`;
     }

    function contributeGoal(goal) {

      const left=Math.max(0,roundMoney(goal.target-goalSaved(goal)));
      openModal(`Set money aside for ${escapeHtml(goal.name)}`,`<form id="contributionForm" class="form-grid"><div class="field"><label for="contributionAccount">From money in</label><select id="contributionAccount">${accountOptions(best?.id)}</select></div>${inputField("Amount ("+currencyConfig().label+")","contributionAmount","number","","min=\"0\" step=\"0.01\" required")}${inputField("Date","contributionDate","date",todayISO(),"required")}${inputField("Note","contributionNote","text","","placeholder=\"Optional note\"")}<div class="field full"><small id="contributionHint" class="subtle"></small></div><div class="field full form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Set aside</button></div></form>`);
      const hint=()=>{const accountId=$("contributionAccount").value;$("contributionHint").textContent=`${money(accountAvailable(accountId))} in ${accountName(accountId)} is not yet set aside. Setting money aside does not move it or change the ${accountName(accountId)} balance; it only lowers what is available to spend.${left?` ${money(left)} still needed for this goal.`:""} To actually move money, for example to M-Shwari, use Move money.`;};
      hint(); $("contributionAccount").onchange=hint;
      $("contributionForm").onsubmit=event=>{
        event.preventDefault();
        const amount=roundMoney(safeNumber($("contributionAmount").value)), accountId=$("contributionAccount").value, available=accountAvailable(accountId);
        if(amount<=0){toast("Enter an amount greater than zero.");return;}
        if(!accountById(accountId)){toast("Choose an account.");return;}
        // The rule that stops the same money counting for two goals.
        if(amount>available+0.005){toast(available>0?`Only ${money(available)} in ${accountName(accountId)} is not already set aside.`:`Nothing in ${accountName(accountId)} is free to set aside.`);return;}
        state.allocations.push({id:id(),goalId:goal.id,accountId,amount,date:$("contributionDate").value||todayISO(),note:$("contributionNote").value.trim(),reference:"",createdAt:new Date().toISOString()});
        closeModal();commit(`${money(amount)} set aside for ${goal.name}`);
      };
    }

      $("releaseAccount").onchange=()=>{const item=holdings.find(entry=>entry.account.id===$("releaseAccount").value);if(item)$("releaseAmount").value=item.amount;};

    // "Use money from savings goal": one real expense from the account that paid, and the goal
    // reduced by the same amount. Linked, so deleting/editing the expense keeps the goal right.
    function useFromGoalForm(goal) {
      const goals=state.goals.filter(entry=>goalSaved(entry)>0.004);
      if(!goals.length){toast("No savings goal has money in it yet.");return;}
      const selected=goal&&goalSaved(goal)>0.004?goal:goals[0];
      openModal("Use money from savings goal",`<form id="useGoalForm" class="form-grid"><div class="field full"><label for="useGoal">Savings goal</label><select id="useGoal">${goals.map(entry=>`<option value="${escapeHtml(entry.id)}" ${String(entry.id)===String(selected.id)?"selected":""}>${escapeHtml(entry.name)} · ${money(goalSaved(entry))} saved</option>`).join("")}</select></div>${inputField("Amount used ("+currencyConfig().label+")","useAmount","number","","min=\"0\" step=\"0.01\" required")}${inputField("Date","useDate","date",todayISO(),"required")}<div class="field"><label for="useAccount">Paid from</label><select id="useAccount">${accountOptions(defaultAccountId())}</select></div><div class="field"><label for="useHolding">Take from savings held in</label><select id="useHolding"></select></div><div class="field"><label for="useCategory">Spending category</label><select id="useCategory">${categoryOptionsWithFallback("Other")}</select></div>${inputField("Description","useNote","text","","placeholder=\"e.g. Hospital bill\"")}<div class="field full"><small id="useHint" class="subtle"></small></div><div class="field full form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Record spending</button></div></form>`);
      const currentGoal=()=>state.goals.find(entry=>String(entry.id)===$("useGoal").value);
      const fillHoldings=()=>{const g=currentGoal(), paid=$("useAccount").value, list=goalHoldings(g).filter(item=>item.amount>0).sort((a,b)=>(b.account.id===paid)-(a.account.id===paid)||b.amount-a.amount);$("useHolding").innerHTML=list.map(item=>`<option value="${escapeHtml(item.account.id)}">${escapeHtml(item.account.name)} · ${money(item.amount)}</option>`).join("");hint();};
      const hint=()=>{const g=currentGoal(), amount=roundMoney(safeNumber($("useAmount").value));$("useHint").textContent=`This records ${amount?money(amount):"the amount"} as spending from ${accountName($("useAccount").value)} and reduces ${g.name} by the same amount (now ${money(goalSaved(g))}). It is counted as spending once.`;};
      $("useGoal").onchange=fillHoldings; $("useAccount").onchange=fillHoldings; $("useAmount").oninput=hint; fillHoldings();
      $("useGoalForm").onsubmit=event=>{
        event.preventDefault();
        const g=currentGoal(), amount=roundMoney(safeNumber($("useAmount").value)), paidFrom=$("useAccount").value, holding=$("useHolding").value, date=$("useDate").value||todayISO(), note=$("useNote").value.trim();
        if(amount<=0){toast("Enter an amount greater than zero.");return;}
        if(!accountById(paidFrom)){toast("Choose the account you paid from.");return;}
        const held=goalOnAccount(g.id,holding);
        if(amount>held+0.005){toast(`Only ${money(held)} of ${g.name} is held in ${accountName(holding)}.`);return;}
        // After this, the paid-from account loses the amount; if the money came from the same account's
        // reserved savings, that reservation is released at the same time, so free money is unchanged.
        const released=paidFrom===holding?amount:0, balanceAfter=roundMoney(accountBalance(paidFrom)-amount), availableAfter=roundMoney(accountAvailable(paidFrom)-amount+released);
        if(balanceAfter<-0.004&&!confirm(`This is more than the ${money(accountBalance(paidFrom))} PesaPilot shows in ${accountName(paidFrom)}. Record it anyway?`))return;
        else if(balanceAfter>=-0.004&&availableAfter<-0.004&&!confirm(`${money(-availableAfter)} of this would come from money set aside for other goals in ${accountName(paidFrom)}. Record it anyway?`))return;
        const category=$("useCategory").value||"Other", txId=id(), description=note||`Paid from ${g.name} savings`;
        state.transactions.push({id:txId,type:"expense",amount,category,date,accountId:paidFrom,paymentMethod:accountName(paidFrom),notes:description,description,reference:`goaluse:${g.id}`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
        state.allocations.push({id:id(),goalId:g.id,accountId:holding,amount:-amount,date,note:`Used: ${description}`,reference:`expense:${txId}`,kind:"use",createdAt:new Date().toISOString()});
        closeModal();commit(`${money(amount)} spent from ${g.name}`);
      };
    }
    // Corrections never delete history: they add an entry that changes the reserved amount.
    function allocationEffective(entry) { return roundMoney(entry.amount + sum(state.allocations.filter(other => other.reference === `correction:${entry.id}`), other => other.amount)); }
    function correctAllocation(entry, mode) {
      if(!entry||entry.amount<=0||entry.reference){toast("Only money you set aside yourself can be corrected here.");return;}
      const goal=state.goals.find(item=>String(item.id)===String(entry.goalId)); if(!goal)return;
      const effective=allocationEffective(entry);
      const apply=target=>{
        const difference=roundMoney(target-effective);
        if(Math.abs(difference)<0.005){toast("Nothing to change.");return false;}
        if(difference<0&&-difference>goalOnAccount(goal.id,entry.accountId)+0.005){toast(`Only ${money(goalOnAccount(goal.id,entry.accountId))} of ${goal.name} is still held in ${accountName(entry.accountId)}.`);return false;}
        if(difference>0&&difference>accountAvailable(entry.accountId)+0.005){toast(`Only ${money(accountAvailable(entry.accountId))} in ${accountName(entry.accountId)} is not already set aside.`);return false;}
        state.allocations.push({id:id(),goalId:goal.id,accountId:entry.accountId,amount:difference,date:todayISO(),note:target===0?`Reversed: ${money(effective)} set aside on ${dateText(entry.date)}`:`Correction: ${money(effective)} → ${money(target)} (set aside on ${dateText(entry.date)})`,reference:`correction:${entry.id}`,kind:"correction",createdAt:new Date().toISOString()});
        return true;
      };
      if(mode==="reverse"){
        if(!confirm(`Reverse the ${money(effective)} set aside on ${dateText(entry.date)}? A correction entry is added; nothing is deleted.`))return;
        if(apply(0)){closeModal();commit("Set-aside reversed");}
        return;
      }
      openModal("Correct a set-aside amount",`<form id="correctForm" class="form-grid"><div class="field full"><p class="subtle" style="margin:0">${escapeHtml(goal.name)} · ${escapeHtml(accountName(entry.accountId))} · set aside on ${dateText(entry.date)}. Currently counts as <strong>${money(effective)}</strong>.</p></div>${inputField("Correct amount ("+currencyConfig().label+")","correctAmount","number",effective,"min=\"0\" step=\"0.01\" required")}<div class="field full"><small class="subtle">A correction entry is added to the history. Nothing is deleted, and no income or spending is created.</small></div><div class="field full form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save correction</button></div></form>`);
      $("correctForm").onsubmit=event=>{event.preventDefault();const target=roundMoney(safeNumber($("correctAmount").value));if(apply(target)){closeModal();commit("Set-aside corrected");}};
    }
    function goalBreakdown(goal) {
      const entries=liveAllocations().filter(entry=>String(entry.goalId)===String(goal.id));
      const holdings=goalHoldings(goal);
      return {
        saved:goalSaved(goal),

    // DEC-016: a reconciliation records a labelled adjustment, never income or spending

    function reconcileForm(account) {
      if(!account)return;
      openModal(`Reconcile ${escapeHtml(account.name)}`,`<form id="reconcileForm" class="form-grid">${inputField("Balance on date","recDate","date",todayISO(),"required")}<div class="field"><label>PesaPilot shows</label><strong id="recRecorded" style="font-size:22px;display:block;margin-top:8px"></strong></div>${inputField("Actual balance ("+currencyConfig().label+")","recActual","number","","step=\"0.01\" required placeholder=\"What M-Pesa, the bank or your wallet shows\"")}${inputField("Reason","recReason","text","","required placeholder=\"e.g. Small M-Pesa payments not recorded\"",true)}<div class="field full"><label><input id="recUnrecorded" type="checkbox" style="width:auto;margin-right:6px"/> I spent the difference and didn't record it: count it as spending</label></div><div class="field full"><small id="recPreview" class="subtle"></small></div><div class="field full form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Record adjustment</button></div></form>`);
      const read=()=>{const date=$("recDate").value||todayISO(), recorded=accountBalance(account.id,date), raw=$("recActual").value.trim(), valid=raw!==""&&Number.isFinite(Number(raw)), actual=valid?roundMoney(raw):null, diff=valid?roundMoney(actual-recorded):null;return {date,recorded,actual,diff,valid};};
      const update=()=>{const r=read();$("recRecorded").textContent=money(r.recorded);const shortfall=r.valid&&r.diff<-0.004;$("recUnrecorded").disabled=!shortfall;if(!shortfall)$("recUnrecorded").checked=false;$("recPreview").textContent=!r.valid?"Enter the balance shown by M-Pesa, your bank or your wallet on that date.":Math.abs(r.diff)<0.005?"Already matches. Nothing to adjust.":`Difference ${r.diff>0?"+":"−"}${plainMoney(r.diff)}. ${shortfall&&$("recUnrecorded").checked?"It will be recorded as unrecorded spending.":"It will be recorded as a balance adjustment: not income or spending."}`;};
      ["recDate","recActual","recUnrecorded"].forEach(field=>{$(field).addEventListener("input",update);$(field).addEventListener("change",update);});
      update();
      $("reconcileForm").onsubmit=event=>{
        event.preventDefault();
        const r=read(), reason=$("recReason").value.trim();
        if(!r.valid){toast("Enter the actual balance.");return;}
        if(!reason){toast("Add a short reason so the adjustment is clear later.");return;}
        if(Math.abs(r.diff)<0.005){toast("The balance already matches. Nothing to adjust.");return;}
        const reconciliation={recordedBalance:r.recorded,actualBalance:r.actual,difference:r.diff,recordedAt:new Date().toISOString()};
        const common={id:id(),amount:Math.abs(r.diff),date:r.date,accountId:account.id,paymentMethod:account.name,notes:reason,description:reason,reference:"",reconciliation,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
        if(r.diff<0&&$("recUnrecorded").checked){
          if(!state.categories.some(category=>category.name.toLowerCase()==="unrecorded spending"))state.categories.push({id:"unrecorded-spending",name:"Unrecorded spending"});
          state.transactions.push({...common,type:"expense",category:"Unrecorded spending"});
        } else state.transactions.push({...common,type:"adjustment",direction:r.diff>0?"in":"out",category:"Balance adjustment"});
        closeModal();commit(`${account.name} reconciled to ${money(r.actual)}`);
      };
    }
    function reconcileHistory(account) {

    }
    function reverseTransaction(item) {

      if(item.reversedBy){toast("This entry has already been reversed.");return;}
      if(!isAudited(item)){toast("Only adjustments are reversed. Edit or delete ordinary entries instead.");return;}
      if(!confirm(`Reverse this ${item.type==="expense"?"unrecorded spending":"adjustment"} of ${money(item.amount)}? Both entries stay in your history and cancel each other out.`))return;
      const reversal={id:id(),type:item.type,direction:item.direction,amount:item.amount,category:item.category,date:todayISO(),accountId:item.accountId,paymentMethod:item.paymentMethod,notes:`Reversal of: ${item.notes||kindInfo(item).label}`,description:`Reversal of: ${item.notes||kindInfo(item).label}`,reference:"",reversesId:item.id,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      if(reversal.direction===undefined)delete reversal.direction;
      item.reversedBy=reversal.id; state.transactions.push(reversal);
      closeModal();commit("Adjustment reversed");
    }

           if(action==="add-category"){const name=prompt("New category name")?.trim();if(name&&!state.categories.some(x=>x.name.toLowerCase()===name.toLowerCase())){state.categories.push({id:name.toLowerCase(),name});commit("Category added");}else if(name){toast("That category already exists.");}}
           if(action==="edit-category"){const cat=state.categories.find(x=>x.id===itemId);if(!cat)return;const name=prompt("Rename category",cat.name)?.trim();if(name&&name!==cat.name){if(state.categories.some(x=>x.id!==cat.id&&x.name.toLowerCase()===name.toLowerCase())){toast("That category already exists.");return;}const oldName=cat.name;state.transactions.forEach(x=>{if(x.category===oldName)x.category=name;});state.budgets.categoryBudgets[name]=state.budgets.categoryBudgets[oldName]||0;delete state.budgets.categoryBudgets[oldName];cat.id=name.toLowerCase();cat.name=name;commit("Category renamed");}}
           if(action==="delete-category"){const cat=state.categories.find(x=>x.id===itemId);if(!cat)return;if(confirm(`Delete ${cat.name}? Existing transactions will move to Other.`)){state.transactions.forEach(x=>{if(x.category===cat.name)x.category="Other";});state.categories=state.categories.filter(x=>x.id!==itemId);delete state.budgets.categoryBudgets[cat.name];commit("Category deleted");}}
           if(action==="export-backup"){downloadBackup();render();return;}
           if(action==="restore-safety-backup") return restoreSafetyBackup();
           if(action==="download-pre-upgrade") return downloadPreUpgradeSnapshot();
           if(action==="reset-data") return protectedReset();
           if(action==="install-app"){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null;});}else toast("Install is not available in this browser yet.");}
        };
      });
    }
    $("modalBackdrop").addEventListener("click",event=>{if(event.target===$("modalBackdrop"))closeModal();});
     document.addEventListener("keydown",event=>{
       if(event.key!=="Escape" && event.key!=="Tab") return;
       if(!$("modalBackdrop").classList.contains("open")) return;
       if(event.key==="Escape"){event.preventDefault();closeModal();return;}
       const focusable=[...$("modal").querySelectorAll("button,input,select,textarea,[href]")].filter(item=>!item.disabled&&item.offsetParent!==null);
       if(!focusable.length)return;
       const first=focusable[0],last=focusable[focusable.length-1];
       if(event.shiftKey && document.activeElement===first){event.preventDefault();last.focus();}
       else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
     });
     window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();deferredInstallPrompt=event;});
     window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;toast("PesaPilot was installed.");});
     const colorScheme=window.matchMedia?.("(prefers-color-scheme: dark)");
     colorScheme?.addEventListener?.("change",()=>{if(state.profile.theme==="system")applyTheme();});
    let pinChecking=false, pinMessage="";
    document.querySelectorAll("[data-pin]").forEach(button=>button.onclick=()=>{
      if(pinChecking)return;
      if(pinLockSeconds()>0){updatePin();return;}
      const key=button.dataset.pin; pinMessage="";
      if(key==="clear")pinInput="";else if(key==="back")pinInput=pinInput.slice(0,-1);else if(pinInput.length<8)pinInput+=key;
      updatePin();
      if(hasPin()&&pinInput.length===pinLength())checkPinEntry();
    });
    async function checkPinEntry(){
      pinChecking=true; let ok=false;
      try { ok=await verifyPin(pinInput); } catch { ok=false; }
      pinChecking=false; pinInput="";
      if(ok){ clearPinFailures(); unlocked=true; $("lockScreen").classList.add("hidden"); if(state.pin&&!state.pinHash)upgradeStoredPin(); }
      else { recordPinFailure(); pinMessage="Incorrect PIN"; }
      updatePin();
    }
    function updatePin(){ const wait=pinLockSeconds(); $("pinDots").innerHTML=Array.from({length:hasPin()?pinLength():4},(_,i)=>`<span class="pin-dot ${i<pinInput.length?"filled":""}"></span>`).join("");$("pinNote").textContent=wait>0?`Too many attempts. Try again in ${wait} seconds.`:pinMessage; if(wait>0)setTimeout(updatePin,1000); }
    render();
     maybeShowOnboarding();
     dismissSplash();
  })();
  </script>
</body>
</html>
