
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="description" content="PesaPilot — make your money last until the next payday." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PesaPilot — Make your money last</title>
  <style>
    :root {
      --ink: #0F172A;
      --ink-2: #1E293B;
      --muted: #64748B;
      --muted-light: #94A3B8;
      --line: #E2E8F0;
      --paper: #F8FAFC;
      --card: #FFFFFF;
      --teal: #10B981;
      --teal-dark: #059669;
      --teal-soft: #ECFDF5;
      --blue: #3B82F6;
      --blue-dark: #2563EB;
      --blue-soft: #EFF6FF;
      --amber: #F59E0B;
      --amber-dark: #D97706;
      --amber-soft: #FFFBEB;
      --red: #F43F5E;
      --red-dark: #E11D48;
      --red-soft: #FFF1F2;
      --green: #059669;
      --green-soft: #ECFDF5;
      --shadow: 0 4px 16px rgba(15, 23, 42, .06);
      --radius: 18px;
      --color-primary: #0F172A;
      --color-primary-light: #1E293B;
      --color-brand: #10B981;
      --color-brand-dark: #059669;
      --color-background: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-text: #0F172A;
      --color-text-secondary: #64748B;
      --color-text-muted: #94A3B8;
      --color-border: #E2E8F0;
      --color-income: #10B981;
      --color-income-bg: #ECFDF5;
      --color-expense: #F43F5E;
      --color-expense-bg: #FFF1F2;
      --color-warning: #F59E0B;
      --color-warning-bg: #FFFBEB;
      --color-info: #3B82F6;
      --color-info-bg: #EFF6FF;
    }
    :root[data-theme="dark"] {
      --ink: #F8FAFC;
      --ink-2: #E2E8F0;
      --muted: #94A3B8;
      --muted-light: #64748B;
      --line: #334155;
      --paper: #0F172A;
      --card: #1E293B;
      --teal: #34D399;
      --teal-dark: #10B981;
      --teal-soft: #064E3B;
      --blue: #60A5FA;
      --blue-dark: #3B82F6;
      --blue-soft: #172554;
      --amber: #FBBF24;
      --amber-dark: #F59E0B;
      --amber-soft: #451A03;
      --red: #FB7185;
      --red-dark: #F43F5E;
      --red-soft: #4C0519;
      --green: #34D399;
      --green-soft: #064E3B;
      --shadow: 0 4px 16px rgba(0,0,0,.24);
    }
     :root[data-theme="dark"] .topbar { background: rgba(15,23,42,.93); border-bottom-color: rgba(51,65,85,.9); }
     :root[data-theme="dark"] .card { border-color: rgba(51,65,85,.9); }
     :root[data-theme="dark"] .card.soft { background: linear-gradient(145deg,#064E3B,#1E293B); border-color: #047857; }
     :root[data-theme="dark"] .btn, :root[data-theme="dark"] input, :root[data-theme="dark"] select, :root[data-theme="dark"] textarea { color: var(--ink); background: var(--card); }
     :root[data-theme="dark"] .btn.danger { background: #4C0519; border-color: #9F1239; }
     :root[data-theme="dark"] .nav button.active { background: var(--card); }
     :root[data-theme="dark"] .badge.neutral { color: var(--ink-2); background: #334155; }
     :root[data-theme="dark"] .list-row { border-bottom-color: #334155; }
     :root[data-theme="dark"] .progress { background: #334155; }
     :root[data-theme="dark"] .modal { background: var(--card); }
     :root[data-theme="dark"] .close { color: var(--ink-2); background: #334155; }
     :root[data-theme="dark"] .bottom-nav { background: rgba(15,23,42,.95); }
     :root[data-theme="dark"] .calendar-cell { border-color: #334155; background: #172033; }
     :root[data-theme="dark"] .insight { background: #172033; }
     :root[data-theme="dark"] .category-chip { color: var(--ink-2); background: #334155; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid rgba(16,185,129,.4); outline-offset: 2px; }
    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px max(18px, calc((100vw - 1180px) / 2));
      background: rgba(248,250,252,.93); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226,232,240,.85);
    }
    .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
     .brand-mark {
       width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 12px; color: #fff; background: var(--ink); font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand-copy { line-height: 1.08; }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .brand-copy span { color: var(--muted); font-size: 11px; }
    .device-pill { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .bill-reminder-pill { display: none; align-items: center; gap: 5px; padding: 5px 8px; border: 1px solid #FED7AA; border-radius: 999px; color: var(--amber-dark); background: var(--amber-soft); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .bill-reminder-pill.show { display: inline-flex; }
    .bill-reminder-pill:before { content: "•"; color: var(--red); font-size: 17px; line-height: 8px; }
     .connection-pill { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
     .connection-pill:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
     .connection-pill.offline:before { background: var(--amber); }
    .layout { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 96px; }
    .view { display: none; animation: rise .22s ease both; }
    .view.active { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .eyebrow { margin: 0 0 4px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(27px, 4vw, 42px); line-height: 1.04; letter-spacing: -.05em; }
    h2 { margin-bottom: 4px; font-size: 22px; letter-spacing: -.03em; }
    h3 { margin-bottom: 2px; font-size: 16px; }
    .subtle { color: var(--muted); }
    .page-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 21px; }
    .page-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .card {
      background: var(--card); border: 1px solid rgba(226,232,240,.9); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 19px;
    }
    .card.soft { background: linear-gradient(145deg, #ECFDF5, #FFFFFF); border-color: #A7F3D0; }
    .grid { display: grid; gap: 15px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .hero-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 15px; margin-bottom: 15px; }
    .hero {
      min-height: 265px; padding: 25px; overflow: hidden; position: relative;
      background: radial-gradient(circle at 90% 0%, rgba(16,185,129,.24), transparent 38%), var(--ink);
      border: 0; color: #fff;
    }
    .hero:after { content: ""; position: absolute; width: 230px; height: 230px; right: -80px; bottom: -105px; border: 35px solid rgba(255,255,255,.07); border-radius: 50%; }
    .hero .eyebrow { color: #6EE7B7; }
    .hero h1 { max-width: 540px; margin-top: 24px; }
    .hero-greeting { color: #FFFFFF; text-wrap: balance; }
    .hero-name { color: #6EE7B7; }
    .hero-tagline { margin: -13px 0 18px; color: #E2E8F0; font-size: 15px; font-weight: 650; }
    .hero .subtle { color: #CBD5E1; }
    .balance-label { color: #CBD5E1; font-size: 12px; }
    .balance { margin: 3px 0 19px; font-size: clamp(34px, 5vw, 56px); font-weight: 800; letter-spacing: -.07em; line-height: 1; }
    .balance.negative { color: #FDA4AF; }
    .hero-foot { position: absolute; right: 24px; bottom: 22px; left: 24px; display: flex; justify-content: space-between; gap: 10px; align-items: end; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.good { color: var(--green); background: var(--green-soft); }
    .badge.warn { color: var(--amber); background: var(--amber-soft); }
    .badge.bad { color: var(--red); background: var(--red-soft); }
    .badge.neutral { color: var(--ink-2); background: #F1F5F9; }
    .metric { min-height: 126px; }
    .metric .metric-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin: 10px 0 2px; font-size: 24px; letter-spacing: -.045em; }
    .metric-value.green { color: var(--green); }
    .metric-value.red { color: var(--red); }
    .metric-value.blue { color: var(--blue); }
    .metric small { color: var(--muted); }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .section-title h2 { margin: 0; }
    .btn {
      border: 1px solid var(--line); border-radius: 11px; padding: 9px 13px; color: var(--ink);
      background: #fff; font-weight: 700; transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15,23,42,.1); }
    .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn.primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
    .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.danger { color: var(--red-dark); border-color: #FECDD3; background: #FFF1F2; }
    .btn.small { padding: 6px 9px; border-radius: 8px; font-size: 12px; }
    .btn-link { border: 0; background: transparent; color: var(--blue-dark); padding: 0; font-weight: 700; }
    .nav {
      display: flex; gap: 5px; overflow-x: auto; margin: 0 auto 24px; padding-bottom: 2px;
      scrollbar-width: thin;
    }
    .nav button {
      flex: 0 0 auto; border: 0; border-radius: 10px; padding: 9px 12px; color: var(--muted);
      background: transparent; font-weight: 700; white-space: nowrap;
    }
    .nav button.active { color: var(--ink); background: #fff; box-shadow: 0 4px 12px rgba(15,23,42,.08); }
    .progress { height: 8px; overflow: hidden; border-radius: 99px; background: #E2E8F0; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--teal); transition: width .35s ease; }
    .progress.blue > span { background: var(--blue); }
    .progress.red > span { background: var(--red); }
    .progress-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .list { display: grid; gap: 9px; }
    .list-row {
      display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #F1F5F9;
    }
    .list-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .list-row:first-child { padding-top: 0; }
    .row-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 11px; background: var(--blue-soft); color: var(--blue); font-weight: 800; }
    .row-icon.income { color: var(--green); background: var(--green-soft); }
    .row-icon.bill { color: var(--amber); background: var(--amber-soft); }
    .row-main { min-width: 0; flex: 1; }
    .row-main strong, .row-main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-main strong { font-size: 13px; }
    .row-main span { color: var(--muted); font-size: 11px; }
    .row-amount { flex: 0 0 auto; text-align: right; font-weight: 800; }
    .row-amount.income { color: var(--green); }
    .row-amount.expense { color: var(--red); }
    .empty { padding: 23px 8px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink-2); }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .field { display: grid; gap: 5px; }
    .field.full { grid-column: 1/-1; }
    label { color: var(--ink-2); font-size: 12px; font-weight: 800; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
      color: var(--ink); background: #fff; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(16,185,129,.14); }
    textarea { min-height: 76px; resize: vertical; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .toolbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: end; margin-bottom: 15px; }
    .toolbar .field { min-width: 145px; flex: 1; }
    .toolbar .field.search { min-width: 220px; flex: 2; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { padding: 12px 9px; border-bottom: 1px solid #F1F5F9; text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    td { font-size: 13px; }
    td.amount { font-weight: 800; }
    td.amount.income { color: var(--green); }
    td.amount.expense { color: var(--red); }
    .actions { display: flex; justify-content: flex-end; gap: 6px; }
    .split { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .kv { display: grid; gap: 5px; }
    .kv > div { display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 12px; }
    .kv > div strong { color: var(--ink); text-align: right; }
    .callout { display: flex; gap: 11px; padding: 13px; margin-top: 13px; border-radius: 13px; background: var(--blue-soft); color: var(--ink-2); }
    .callout.warn { background: var(--amber-soft); }
    .callout.bad { background: var(--red-soft); }
    .callout-icon { font-weight: 900; color: var(--blue); }
    .callout.warn .callout-icon { color: var(--amber); }
    .callout.bad .callout-icon { color: var(--red); }
    .bill-reminders { margin-bottom: 15px; border-color: #FED7AA; background: #FFFBEB; }
    .bill-reminder-row { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #FDE68A; }
    .bill-reminder-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .bill-reminder-row:first-child { padding-top: 0; }
    .bill-reminder-row .row-icon { background: var(--amber-soft); color: var(--amber-dark); }
    .bill-reminder-row.overdue .row-icon { background: var(--red-soft); color: var(--red-dark); }
    .bill-reminder-row.overdue .row-amount { color: var(--red-dark); }
    .reminder-copy { min-width: 0; flex: 1; }
    .reminder-copy strong, .reminder-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reminder-copy span { color: var(--muted); font-size: 11px; }
     .countdown-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 5px 7px; border-radius: 8px; color: #92400E; background: #FEF3C7; font-size: 11px; font-weight: 900; letter-spacing: .02em; }
     .focus-card { position: relative; overflow: hidden; background: linear-gradient(145deg,#0B2745,#0F766E); border: 0; color: #fff; }
     .focus-card:after { content: ""; position: absolute; width: 150px; height: 150px; right: -55px; top: -65px; border: 24px solid rgba(255,255,255,.09); border-radius: 50%; }
     .focus-kicker { display: flex; align-items: center; gap: 8px; color: #A7F3D0; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
     .focus-card h2 { max-width: 280px; margin: 18px 0 8px; color: #fff; }
     .focus-card p { position: relative; z-index: 1; max-width: 320px; margin-bottom: 18px; color: #D1FAE5; }
     .focus-card .btn { position: relative; z-index: 1; color: #0F172A; background: #fff; border-color: #fff; }
     .marketing-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; padding: 15px 2px 8px; color: var(--muted); font-size: 11px; }
     .marketing-footer-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 800; }
     .marketing-footer a { color: var(--blue-dark); font-weight: 800; text-decoration: none; }
     .marketing-footer a:hover { text-decoration: underline; }
     /* Home contrast: keep the greeting and reminder card readable on every theme/browser. */
     #homeView .hero { background: #071B38 !important; color: #FFFFFF !important; }
     #homeView .hero h1, #homeView .hero .hero-greeting, #homeView .hero .balance { color: #FFFFFF !important; }
     #homeView .hero .hero-name { color: #6EE7B7 !important; }
     #homeView .hero .eyebrow { color: #6EE7B7 !important; }
     #homeView .hero .hero-tagline, #homeView .hero .balance-label, #homeView .hero .hero-foot { color: #E2E8F0 !important; }
     #homeView .bill-reminders { color: #172033; background: #FFFDF5; border-color: #F59E0B; }
     #homeView .bill-reminders h2, #homeView .bill-reminders .reminder-copy strong, #homeView .bill-reminders .row-amount { color: #172033; }
     #homeView .bill-reminders .subtle, #homeView .bill-reminders .reminder-copy span { color: #475569; opacity: 1; }
     #homeView .bill-reminders .btn-link { color: #1D4ED8; }
     #homeView .bill-reminder-row { border-bottom-color: #FDE68A; }
     #homeView .bill-reminder-row.overdue .row-amount { color: #BE123C; }
     .app-notice { display: none; margin: 0 0 15px; padding: 12px 14px; border: 1px solid #FECDD3; border-radius: 12px; color: var(--red-dark); background: var(--red-soft); }
     .app-notice.show { display: block; }
    .budget-line { display: grid; gap: 7px; margin: 13px 0; }
    .budget-line .split { font-size: 12px; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 5px; }
    .calendar-head { color: var(--muted); font-size: 10px; font-weight: 800; text-align: center; text-transform: uppercase; }
    .calendar-cell { min-height: 72px; padding: 7px; border: 1px solid #F1F5F9; border-radius: 9px; background: #FFFFFF; }
    .calendar-cell.muted { opacity: .42; }
    .calendar-cell.today { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
    .calendar-day { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .calendar-event { display: block; overflow: hidden; margin-top: 3px; padding: 3px 4px; border-radius: 5px; color: var(--amber); background: var(--amber-soft); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .calendar-event.paid { color: var(--green); background: var(--green-soft); }
    .score { display: flex; align-items: center; gap: 15px; }
    .score-number { width: 72px; height: 72px; display: grid; place-items: center; flex: 0 0 auto; border: 7px solid var(--teal-soft); border-right-color: var(--teal); border-radius: 50%; color: var(--teal); font-size: 22px; font-weight: 800; }
    .insight-list { display: grid; gap: 9px; }
    .insight { display: flex; gap: 10px; padding: 11px; border-radius: 11px; background: #F8FAFC; }
    .insight strong { display: block; margin-bottom: 2px; }
    .insight span { color: var(--muted); font-size: 12px; }
    .trend-bars { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; align-items: end; height: 150px; padding-top: 12px; }
    .trend-col { display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; text-align: center; }
    .trend-bar-wrap { display: flex; align-items: end; justify-content: center; height: 100%; }
    .trend-bar { width: min(30px,70%); min-height: 3px; border-radius: 7px 7px 2px 2px; background: var(--teal); }
    .trend-col span { color: var(--muted); font-size: 10px; }
    .category-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 7px; background: #F1F5F9; color: var(--ink-2); font-size: 11px; }
    .dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: var(--teal); }
    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }
    .dot.amber { background: var(--amber); }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; display: none; align-items: end; justify-content: center;
       padding: 14px; background: rgba(15,23,42,.46); backdrop-filter: blur(5px);
    }
     .modal-backdrop.open { display: flex; }
     .modal { width: min(620px,100%); max-height: min(92vh, 760px); overflow: auto; overscroll-behavior: contain; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); border-radius: 20px 20px 14px 14px; background: var(--card); box-shadow: 0 24px 70px rgba(15,23,42,.24); animation: modal-in .2s ease both; }
     .modal .form-actions { flex-wrap: wrap; }
     .modal .form-actions .btn { min-height: 42px; }
     .inline-error { display: none; margin: 8px 0 0; color: var(--red-dark); font-size: 12px; font-weight: 700; }

  <script>
  (() => {
    "use strict";
    const STORAGE_KEY = "pesapilot_v2";
    const DEVICE_KEY = "pesapilot_device_id";
    const ONBOARDING_KEY = "pesapilot_onboarding_v1";
      const SAFETY_BACKUP_KEY = "pesapilot_safety_backup_v9";
       const SCHEMA_VERSION = 9;
     const BACKUP_VERSION = 3;
    const navItems = [
      ["home","Home","⌂"],["money","Money","₿"],["plan","Plan","◌"],["goals","Goals","◎"],
      ["bills","Bills","▣"],["debts","Debts","↗"],["reports","Reports","▤"],["settings","Settings","⚙"]
    ];
    const defaultCategories = ["Food","Transport","Housing","Utilities","Health","Shopping","Entertainment","Family","Education","Other"];
    const paymentMethods = ["M-Pesa","Cash","Bank","Card","Other"];
    let activeView = "home";
     let reportMonth = "";
      let billMonth = "";
      let billMonthWasSelected = false;
    let transactionFilters = { search:"", type:"all", category:"all", paymentMethod:"all", from:"", to:"", sort:"date-desc" };
    let pinInput = "";
     let unlocked = false;
      let modalReturnFocus = null;
      let deferredInstallPrompt = null;
     let storageWarning = "";
     let storageReadOnly = false;
     let state;

    const $ = id => document.getElementById(id);
     const currencyConfig = () => ({
       KSh: { label:"KSh", locale:"en-KE" },
       USD: { label:"$", locale:"en-US" },
       UGX: { label:"UGX", locale:"en-UG" },
       TZS: { label:"TSh", locale:"sw-TZ" }
     }[state?.profile?.currency] || { label:"KSh", locale:"en-KE" });
     const money = value => {
       const number = Number(value) || 0, config = currencyConfig();
       return `${number < 0 ? "−" : ""}${config.label} ${Math.abs(Math.round(number)).toLocaleString(config.locale)}`;
     };
     const plainMoney = value => {
       const config = currencyConfig();
       return `${config.label} ${Math.abs(Math.round(Number(value)||0)).toLocaleString(config.locale)}`;
     };
    const dateText = value => {
      if (!value) return "No date";
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString("en-KE",{day:"numeric",month:"short",year:"numeric"});
    };
     // Use the device's local calendar date. UTC conversion can shift Nairobi dates
     // around midnight and make a bill appear one day early or late.
     const todayISO = () => localISO(new Date());
     function timeGreeting() {
       const hour = new Date().getHours();
       return hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
     }
      function billCycleStart(bill, reference=todayISO()) {
        if (!bill || bill.frequency !== "monthly") return reference;
        return `${String(reference).slice(0,7)}-01`;
      }
      function billOverdueOccurrence(bill, reference=todayISO()) {
        if (!bill || !reference) return "";
        const today = new Date(`${reference}T12:00:00`);
        if (Number.isNaN(today.getTime())) return "";
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const pastStart = new Date(today);
        pastStart.setFullYear(pastStart.getFullYear() - 1);
         const start = billCycleStart(bill,reference) === reference ? localISO(pastStart) : billCycleStart(bill,reference);
         return billOccurrencesBetween(bill,start,localISO(yesterday))
          .reverse().find(date => !billIsPaidOn(bill,date)) || "";
      }
      function billReminderFor(bill, reference=todayISO()) {
        const today = new Date(`${reference}T12:00:00`);
        if (!bill || Number.isNaN(today.getTime())) return null;
        // Overdue bills belong in Bills, not in the countdown reminder.
        if (billOverdueOccurrence(bill,reference)) return null;
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const futureEnd = new Date(today);
        futureEnd.setDate(futureEnd.getDate() + 5);
        const upcoming = billOccurrencesBetween(bill,localISO(tomorrow),localISO(futureEnd))
          .find(date => !billIsPaidOn(bill,date));
        if (!upcoming) return null;
        const days = Math.round((new Date(`${upcoming}T12:00:00`)-today)/86400000);
        return days >= 1 && days <= 5 ? { state:"soon", date:upcoming, days } : null;
      }
     function billReminderItems() {
       return state.bills.map(bill => ({ bill, info:billReminderFor(bill) })).filter(item => item.info)
          .sort((a,b) => a.info.date.localeCompare(b.info.date));
     }
    const monthKey = date => String(date || "").slice(0,7);
    const currentMonth = () => todayISO().slice(0,7);
    reportMonth = currentMonth();
     billMonth = currentMonth();
    function applyTheme() {
      const theme = state?.profile?.theme || "system";
      const dark = theme === "dark" || (theme === "system" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }
    const id = () => state.nextId++;
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[char]));
    const safeNumber = value => Math.max(0, Number(value) || 0);
    const sum = (items, getter) => items.reduce((total,item) => total + Number(getter(item) || 0), 0);
    const uid = () => {
      try {
        const existing = localStorage.getItem(DEVICE_KEY);
        if (existing) return existing;
        const next = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem(DEVICE_KEY,next);
        return next;
      } catch { return "local-device"; }
    };
    const fingerprint = () => {
      if (typeof navigator === "undefined") return "unknown-device";
      const screenSize = typeof screen === "undefined" ? "" : [screen.width,screen.height].sort().join("x");
      return [navigator.userAgent,navigator.platform,navigator.language,screenSize].join("|");
    };
    const blankState = () => ({
      schemaVersion: SCHEMA_VERSION,
        profile: { name:"", avatar:"P", paydayDay:1, monthlyIncome:0, plannedExpenses:0, emergencyFundMonths:3, theme:"system", currency:"KSh" },
      transactions: [], goals: [], bills: [], debts: [], categories: defaultCategories.map(name => ({ id: name.toLowerCase(), name })),
      budgets: { monthlySpending:0, categoryBudgets:{} },
      nextId: 1, pin:"", deviceId:uid(), deviceFingerprint:fingerprint()
    });
    function migrate(raw) {
      const next = blankState();
       const old = raw && typeof raw === "object" ? raw : {};
       const sourceVersion = Math.max(1, Number(old.schemaVersion) || 1);
      next.profile = { ...next.profile, ...(old.profile || {}) };
      next.profile.paydayDay = Math.min(31,Math.max(1,Number(next.profile.paydayDay)||1));
      next.profile.monthlyIncome = safeNumber(next.profile.monthlyIncome);
      next.profile.plannedExpenses = safeNumber(next.profile.plannedExpenses);
      next.profile.emergencyFundMonths = Math.min(12,Math.max(1,Number(next.profile.emergencyFundMonths)||3));
      next.profile.theme = ["system","light","dark"].includes(next.profile.theme) ? next.profile.theme : "system";
       next.profile.currency = ["KSh","USD","UGX","TZS"].includes(next.profile.currency) ? next.profile.currency : "KSh";
      next.pin = typeof old.pin === "string" ? old.pin : "";
      next.deviceId = old.deviceId || uid();
      next.deviceFingerprint = old.deviceFingerprint || fingerprint();
      next.nextId = Number.isFinite(Number(old.nextId)) ? Math.max(1,Number(old.nextId)) : 1;
      next.transactions = Array.isArray(old.transactions) ? old.transactions.map(item => ({
        id: item.id ?? next.nextId++,
        type: item.type === "income" ? "income" : "expense",
        amount: safeNumber(item.amount),
        category: item.category || (item.type === "income" ? "Income" : "Other"),
        date: item.date || todayISO(),
        notes: item.notes || item.description || "",
        description: item.description || item.notes || "",
        paymentMethod: item.paymentMethod || (item.type === "income" ? "Bank" : "Other"),
        reference: item.reference || "",
        createdAt: item.createdAt || new Date().toISOString(),
        updatedAt: item.updatedAt || item.createdAt || new Date().toISOString()
      })) : [];
       next.goals = Array.isArray(old.goals) ? old.goals.map(item => {
         const current=safeNumber(item.current);
         const contributions=Array.isArray(item.contributions) ? item.contributions.map(entry => ({
           id:entry.id ?? next.nextId++, amount:safeNumber(entry.amount), date:entry.date || todayISO(), note:entry.note || ""
         })) : [];
         if (!contributions.length && current > 0) contributions.push({id:next.nextId++,amount:current,date:todayISO(),note:"Migrated balance"});
         return {
           id:item.id ?? next.nextId++, name:item.name || "Unnamed goal", target:safeNumber(item.target),
           current, targetDate:item.targetDate || "", requiredMonthly:safeNumber(item.requiredMonthly),
           requiredWeekly:safeNumber(item.requiredWeekly), contributions
         };
       }) : [];
      next.bills = Array.isArray(old.bills) ? old.bills.map(item => ({
        id:item.id ?? next.nextId++, name:item.name || "Bill", amount:safeNumber(item.amount),
         dueDate:item.dueDate || todayISO(), frequency:["once","weekly","monthly","quarterly","yearly"].includes(item.frequency) ? item.frequency : "monthly", paid:item.paid === true,
         paidDate:item.paidDate || "", paidOccurrence:item.paidOccurrence || "", category:item.category || "Utilities", notes:item.notes || "",
         recordAsExpense:item.recordAsExpense !== false,
         paidOccurrences:Array.isArray(item.paidOccurrences) ? [...new Set(item.paidOccurrences.filter(Boolean))] : (item.paid && (item.paidOccurrence || item.dueDate) ? [item.paidOccurrence || item.dueDate] : []),
         payments:Array.isArray(item.payments) ? item.payments.map(entry => ({
           id:entry.id ?? next.nextId++, occurrenceDate:entry.occurrenceDate || item.paidOccurrence || item.dueDate || todayISO(),
           paymentDate:entry.paymentDate || item.paidDate || entry.occurrenceDate || todayISO(), amount:safeNumber(entry.amount || item.amount),
           paymentMethod:entry.paymentMethod || "Other"
         })) : (item.paid ? [{ id:next.nextId++, occurrenceDate:item.paidOccurrence || item.dueDate || todayISO(), paymentDate:item.paidDate || todayISO(), amount:safeNumber(item.amount), paymentMethod:item.paymentMethod || "Other" }] : [])
      })) : [];
      next.debts = Array.isArray(old.debts) ? old.debts.map(item => ({
        id:item.id ?? next.nextId++, name:item.name || "Debt", creditor:item.creditor || item.name || "",
        total:safeNumber(item.total), repaid:Math.min(safeNumber(item.total),safeNumber(item.repaid)), interestRate:safeNumber(item.interestRate),
        dueDate:item.dueDate || "", notes:item.notes || "", repaymentAmount:safeNumber(item.repaymentAmount),
        repayments:Array.isArray(item.repayments) ? item.repayments.map(entry => ({
          id:entry.id ?? next.nextId++, amount:safeNumber(entry.amount), date:entry.date || todayISO(), note:entry.note || ""
        })) : []
      })) : [];
       // Older versions stored repayments only on the debt record. Recreate the
       // matching expense transaction once so the main balance is accurate.
       next.debts.forEach(debt => (debt.repayments || []).forEach(entry => {
         const reference = `debt:${debt.id}:${entry.id}`;
         if (!next.transactions.some(transaction => transaction.reference === reference)) {
           next.transactions.push({
             id: next.nextId++, type:"expense", amount:safeNumber(entry.amount), category:"Debt repayment",
             date:entry.date || todayISO(), notes:`Repayment of ${debt.name}`, description:`Repayment of ${debt.name}`,
             paymentMethod:entry.paymentMethod || "Other", reference,
             createdAt:entry.createdAt || new Date().toISOString(), updatedAt:new Date().toISOString()
           });
         }
       }));
       const oldCategories = Array.isArray(old.categories) ? old.categories : [];
      const transactionCategories = next.transactions.map(item => item.category);
       const billCategories = next.bills.map(item => item.category);
       const categoryNames = [...defaultCategories,...oldCategories.map(item => typeof item === "string" ? item : item.name),...transactionCategories,...billCategories].filter(Boolean);
      next.categories = [...new Map(categoryNames.map(name => [String(name).toLowerCase(),{ id:String(name).toLowerCase(), name:String(name) }])).values()];
      const oldBudgets = old.budgets || {};
      next.budgets = { monthlySpending:safeNumber(oldBudgets.monthlySpending), categoryBudgets:Object.fromEntries(Object.entries(oldBudgets.categoryBudgets || {}).map(([name,value]) => [name,safeNumber(value)])) };
      const allIds = [
        ...next.transactions.map(item => Number(item.id) || 0),
        ...next.goals.map(item => Number(item.id) || 0),
        ...next.goals.flatMap(item => (item.contributions || []).map(entry => Number(entry.id) || 0)),
        ...next.bills.map(item => Number(item.id) || 0),
         ...next.bills.flatMap(item => (item.payments || []).map(entry => Number(entry.id) || 0)),
        ...next.debts.map(item => Number(item.id) || 0),
        ...next.debts.flatMap(item => (item.repayments || []).map(entry => Number(entry.id) || 0))
      ];
      next.nextId = Math.max(next.nextId - 1, ...allIds, 0) + 1;
       next.schemaVersion = SCHEMA_VERSION;
       next.migratedFromVersion = sourceVersion < SCHEMA_VERSION ? sourceVersion : undefined;
      return next;
    }
    function loadState() {
       try {
         const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
         if (stored && Number(stored.schemaVersion || 1) < SCHEMA_VERSION) {
           try {
             localStorage.setItem(SAFETY_BACKUP_KEY,JSON.stringify({app:"PesaPilot",backupVersion:BACKUP_VERSION,sourceSchemaVersion:Number(stored.schemaVersion||1),createdAt:new Date().toISOString(),data:stored}));
           } catch {}
         }

       }

    function backupPayload(data=state) {
      return { app:"PesaPilot", backupVersion:BACKUP_VERSION, schemaVersion:SCHEMA_VERSION, exportedAt:new Date().toISOString(), data:JSON.parse(JSON.stringify(data)) };
    }
    function downloadBackup(label="backup") {
       try {
         const payload=JSON.stringify(backupPayload(),null,2), blob=new Blob([payload],{type:"application/json"});
         const link=document.createElement("a"), url=URL.createObjectURL(blob);
         link.href=url; link.download=`pesapilot-${label}-${todayISO()}.json`; document.body.appendChild(link); link.click(); link.remove();
         setTimeout(()=>URL.revokeObjectURL(url),500);
         return true;
       } catch {
         toast("The backup could not be downloaded. Try again or use a different browser.");
         return false;
       }
    }
    function createSafetyBackup(label="safety-backup") {
      const payload=backupPayload();
       try {
         localStorage.setItem(SAFETY_BACKUP_KEY,JSON.stringify(payload));
       } catch {
         toast("PesaPilot could not save the safety backup, so no data was changed.");
         return false;
       }
       downloadBackup(label);
       return true;
    }
      function safetyBackupText() {
         try { return localStorage.getItem(SAFETY_BACKUP_KEY) || localStorage.getItem("pesapilot_safety_backup_v8") || localStorage.getItem("pesapilot_safety_backup_v7") || localStorage.getItem("pesapilot_safety_backup_v6") || localStorage.getItem("pesapilot_safety_backup_v5") || ""; }
       catch { return ""; }
     }

     function monthlyCycleDate(dateValue,month=currentMonth()) {
       const source=new Date(`${dateValue||todayISO()}T12:00:00`);
       const target=new Date(`${month}-01T12:00:00`);
       if (Number.isNaN(source.getTime()) || Number.isNaN(target.getTime())) return dateValue||todayISO();
       const lastDay=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
       return `${month}-${String(Math.min(source.getDate(),lastDay)).padStart(2,"0")}`;
     }

          if(action==="close-modal") return closeModal();

           if(action==="forgot-pin") return forgotPin();
           if(action==="confirm-pin-reset") return resetForgottenPin();
          if(action==="edit-profile"){activeView="settings";return render();}
          if(action==="add-income") return transactionForm(null,"income");
          if(action==="add-expense") return transactionForm(null,"expense");
          if(action==="edit-transaction") return transactionForm(state.transactions.find(x=>String(x.id)===String(itemId)));
          if(action==="delete-transaction"){if(confirm("Delete this transaction? This cannot be undone.")){state.transactions=state.transactions.filter(x=>String(x.id)!==String(itemId));commit("Transaction deleted");}}
          if(action==="add-goal") return goalForm();
          if(action==="edit-goal") return goalForm(state.goals.find(x=>String(x.id)===String(itemId)));
          if(action==="contribute-goal") return contributeGoal(state.goals.find(x=>String(x.id)===String(itemId)));
          if(action==="goal-history") return goalHistory(state.goals.find(x=>String(x.id)===String(itemId)));
           if(action==="delete-goal"){if(confirm("Delete this goal, its contribution history and linked savings entries?")){state.goals=state.goals.filter(x=>String(x.id)!==String(itemId));state.transactions=state.transactions.filter(item=>!String(item.reference||"").startsWith(`goal:${itemId}:`));commit("Goal and linked entries deleted");}}
          if(action==="add-bill") return billForm();
          if(action==="edit-bill") return billForm(state.bills.find(x=>String(x.id)===String(itemId)));
             if(action==="pay-bill"){const bill=state.bills.find(x=>String(x.id)===String(itemId));if(bill)return payBill(bill,button.dataset.occurrence||"");}
             if(action==="unpay-bill"){const bill=state.bills.find(x=>String(x.id)===String(itemId));if(!bill)return;const payments=bill.payments||[],lastPayment=payments[payments.length-1],occurrence=lastPayment?.occurrenceDate||bill.paidOccurrence||(bill.paidOccurrences||[]).slice(-1)[0]||bill.dueDate;bill.payments=payments.filter(payment=>payment.id!==lastPayment?.id);bill.paidOccurrences=(bill.paidOccurrences||[]).filter(date=>date!==occurrence || !billIsPaidOn(bill,date));state.transactions=state.transactions.filter(item=>!lastPayment?.id || item.reference!==`bill:${bill.id}:${occurrence}:${lastPayment.id}`);const remainingPayment=bill.payments[bill.payments.length-1];bill.paid=Boolean(bill.paidOccurrences.length);bill.paidDate=remainingPayment?.paymentDate||"";bill.paidOccurrence=remainingPayment?.occurrenceDate||"";commit("Last bill payment undone");}
          if(action==="delete-bill"){if(confirm("Delete this bill?")){state.bills=state.bills.filter(x=>String(x.id)!==String(itemId));commit("Bill deleted");}}
          if(action==="add-debt") return debtForm();
          if(action==="edit-debt") return debtForm(state.debts.find(x=>String(x.id)===String(itemId)));
          if(action==="repay-debt") return repayDebt(state.debts.find(x=>String(x.id)===String(itemId)));
          if(action==="debt-history") return debtHistory(state.debts.find(x=>String(x.id)===String(itemId)));
           if(action==="delete-debt"){if(confirm("Delete this debt and its repayment history?")){state.debts=state.debts.filter(x=>String(x.id)!==String(itemId));state.transactions=state.transactions.filter(item=>!String(item.reference||"").startsWith(`debt:${itemId}:`));commit("Debt deleted");}}
          if(action==="edit-plan") return plannerForm();
          if(action==="edit-category-budgets") return categoryBudgetForm();
           if(action==="add-category"){const name=prompt("New category name")?.trim();if(name&&!state.categories.some(x=>x.name.toLowerCase()===name.toLowerCase())){state.categories.push({id:name.toLowerCase(),name});commit("Category added");}else if(name){toast("That category already exists.");}}
           if(action==="edit-category"){const cat=state.categories.find(x=>x.id===itemId);if(!cat)return;const name=prompt("Rename category",cat.name)?.trim();if(name&&name!==cat.name){if(state.categories.some(x=>x.id!==cat.id&&x.name.toLowerCase()===name.toLowerCase())){toast("That category already exists.");return;}const oldName=cat.name;state.transactions.forEach(x=>{if(x.category===oldName)x.category=name;});state.budgets.categoryBudgets[name]=state.budgets.categoryBudgets[oldName]||0;delete state.budgets.categoryBudgets[oldName];cat.id=name.toLowerCase();cat.name=name;commit("Category renamed");}}
           if(action==="delete-category"){const cat=state.categories.find(x=>x.id===itemId);if(!cat)return;if(confirm(`Delete ${cat.name}? Existing transactions will move to Other.`)){state.transactions.forEach(x=>{if(x.category===cat.name)x.category="Other";});state.categories=state.categories.filter(x=>x.id!==itemId);delete state.budgets.categoryBudgets[cat.name];commit("Category deleted");}}
           if(action==="export-backup") return downloadBackup();
           if(action==="restore-safety-backup") return restoreSafetyBackup();
           if(action==="reset-data") return protectedReset();
           if(action==="install-app"){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null;});}else toast("Install is not available in this browser yet.");}
        };
      });
    }
    $("modalBackdrop").addEventListener("click",event=>{if(event.target===$("modalBackdrop"))closeModal();});
     document.addEventListener("keydown",event=>{
       if(event.key!=="Escape" && event.key!=="Tab") return;
       if(!$("modalBackdrop").classList.contains("open")) return;
       if(event.key==="Escape"){event.preventDefault();closeModal();return;}
       const focusable=[...$("modal").querySelectorAll("button,input,select,textarea,[href]")].filter(item=>!item.disabled&&item.offsetParent!==null);
       if(!focusable.length)return;
       const first=focusable[0],last=focusable[focusable.length-1];
       if(event.shiftKey && document.activeElement===first){event.preventDefault();last.focus();}
       else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
     });
     window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();deferredInstallPrompt=event;});
     window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;toast("PesaPilot was installed.");});
     const colorScheme=window.matchMedia?.("(prefers-color-scheme: dark)");
     colorScheme?.addEventListener?.("change",()=>{if(state.profile.theme==="system")applyTheme();});
    document.querySelectorAll("[data-pin]").forEach(button=>button.onclick=()=>{const key=button.dataset.pin;if(key==="clear")pinInput="";else if(key==="back")pinInput=pinInput.slice(0,-1);else if(pinInput.length<8)pinInput+=key;updatePin();if(state.pin&&pinInput===state.pin){unlocked=true;pinInput="";$("lockScreen").classList.add("hidden");}});
    function updatePin(){ $("pinDots").innerHTML=Array.from({length:state.pin.length},(_,i)=>`<span class="pin-dot ${i<pinInput.length?"filled":""}"></span>`).join("");$("pinNote").textContent=pinInput.length===state.pin.length&&pinInput!==state.pin?"Incorrect PIN":""; }
    render();
     maybeShowOnboarding();
     dismissSplash();
  })();
  </script>
</body>
</html>
